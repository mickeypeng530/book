<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小說閱讀器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 淺色模式 */
        :root {
            --bg-color: #f5f5dc;
            --text-color: #333;
            --header-bg: #fff;
            --border-color: #ddd;
            --button-bg: #4a4a4a;
            --button-text: #fff;
            --chapter-bg: #fff;
            --shadow: rgba(0,0,0,0.1);
        }

        /* 深色模式 */
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #c0c0c0;
            --header-bg: #2d2d2d;
            --border-color: #444;
            --button-bg: #555;
            --button-text: #fff;
            --chapter-bg: #252525;
            --shadow: rgba(0,0,0,0.3);
        }

        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            transition: all 0.3s ease;
        }

        @media (min-width: 1024px) {
            body {
                line-height: 1.5;
            }
        }

        /* 頂部導航列 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 100;
            box-shadow: 0 2px 10px var(--shadow);
            transition: transform 0.3s ease;
        }

        .header.hidden {
            transform: translateY(-100%);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: normal;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* 按鈕樣式 */
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: var(--button-bg);
            color: var(--button-text);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            padding: 0;
            font-size: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 手機版 icon 較小 */
        @media (max-width: 1024px) {
            .btn-icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }

        /* 登入區 */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .login-screen h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .login-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 15px 30px;
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--shadow);
        }

        .login-btn img {
            width: 24px;
            height: 24px;
        }

        /* 側邊章節目錄 */
        .sidebar {
            position: fixed;
            top: 60px;
            left: -320px;
            width: 320px;
            height: calc(100vh - 60px);
            background: var(--header-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            transition: left 0.3s ease;
            z-index: 99;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            position: sticky;
            top: 0;
            background: var(--header-bg);
        }

        .chapter-list {
            list-style: none;
        }

        .chapter-list li {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }

        .chapter-list li:hover {
            background: var(--bg-color);
        }

        .chapter-list li.active {
            background: var(--button-bg);
            color: var(--button-text);
        }

        /* 遮罩 */
        .overlay {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 98;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* 主要內容區 */
        .main-content {
            max-width: 99%;
            margin: 0 auto;
            padding: 80px 8px 120px;
            display: none;
        }

        /* 響應式內容寬度 */
        @media (min-width: 1024px) {
            .main-content {
                max-width: 90%;
                padding: 80px 20px 120px;
            }
        }

        @media (min-width: 1024px) {
            .main-content {
                max-width: 70%;
            }
        }

        @media (min-width: 1440px) {
            .main-content {
                max-width: 75%;
            }
        }

        .main-content.show {
            display: block;
        }

        .chapter-title {
            font-size: 1.4rem;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            text-align: center;
        }

        .chapter-content {
            font-size: 18px;
            text-align: justify;
        }

        .chapter-content p {
            margin-bottom: 1.5em;
            text-indent: 2em;
        }

        /* 底部導航 */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: none;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .footer-nav.show {
            display: flex;
        }

        .footer-nav.hidden {
            transform: translateY(100%);
        }

        .chapter-progress {
            font-size: 14px;
            min-width: 100px;
            text-align: center;
        }

        /* 書籤按鈕 */
        .bookmark-btn {
            font-size: 16px;
            padding: 8px 10px;
            opacity: 0.5;
            transition: all 0.2s;
        }

        .bookmark-btn.active {
            opacity: 1;
            background: var(--button-bg);
            color: var(--button-text);
        }

        /* 書籤直線標記 */
        .bookmark-line {
            position: absolute;
            left: -8px;
            width: 3px;
            background: #3B8BD4;
            opacity: 0.7;
            border-radius: 2px;
            pointer-events: none;
        }

        /* 章節內容容器需要 relative */
        .chapter-content {
            position: relative;
        }

        /* 載入畫面 */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            color: #888;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top-color: var(--button-bg);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 字體控制彈窗 */
        .font-popup, .scroll-popup, .tts-popup, .music-popup {
            position: fixed;
            top: 70px;
            right: 10px;
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 20px var(--shadow);
            display: none;
            z-index: 101;
            min-width: 200px;
        }

        .font-popup.show, .scroll-popup.show, .tts-popup.show, .music-popup.show {
            display: block;
        }

        .popup-section {
            margin-bottom: 15px;
        }

        .popup-section:last-child {
            margin-bottom: 0;
        }

        .popup-section label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #888;
            text-align: center;
        }

        .font-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .font-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            background: var(--button-bg);
            color: var(--button-text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-btn:hover {
            opacity: 0.8;
        }

        .font-size-value {
            min-width: 50px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .font-slider {
            width: 100%;
        }

        /* 字體粗度控制 */
        .weight-controls {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .weight-btn {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: transparent;
            color: var(--text-color);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .weight-btn:hover {
            background: var(--bg-color);
        }

        .weight-btn.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: var(--button-bg);
        }

        /* 自動捲動控制 */
        .scroll-options {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .scroll-opt {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: transparent;
            color: var(--text-color);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scroll-opt:hover {
            background: var(--bg-color);
        }

        .scroll-opt.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: var(--button-bg);
        }

        .scroll-start-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #4ade80;
            color: #000;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scroll-start-btn:hover {
            background: #22c55e;
        }

        .scroll-start-btn.active {
            background: #f87171;
        }

        /* 自動捲動指示器 */
        .scroll-indicator {
            position: fixed;
            top: 70px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(74, 222, 128, 0.35);
            color: #000;
            border-radius: 50%;
            font-size: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scroll-indicator:hover {
            background: rgba(74, 222, 128, 0.7);
        }

        .scroll-indicator.show {
            display: flex;
        }

        /* TTS 指示器 */
        .tts-indicator {
            position: fixed;
            top: 70px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(99, 102, 241, 0.35);
            color: #fff;
            border-radius: 50%;
            font-size: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tts-indicator:hover {
            background: rgba(99, 102, 241, 0.7);
        }

        .tts-indicator.show {
            display: flex;
        }

        /* TTS 選擇器 */
        .tts-select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
        }

        .tts-rate-opt {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: transparent;
            color: var(--text-color);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tts-rate-opt:hover {
            background: var(--bg-color);
        }

        .tts-rate-opt.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: var(--button-bg);
        }

        /* 正在唸的段落 highlight */
        .chapter-content p.tts-speaking {
            background: rgba(99, 102, 241, 0.15);
            border-left: 3px solid #6366f1;
            margin-left: -3px;
            padding-left: 3px;
        }

        /* 背景音樂 */
        .music-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .music-item {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 14px;
        }

        .music-item:hover {
            background: var(--bg-color);
        }

        .music-item.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: var(--button-bg);
        }

        .music-item.playing {
            background: #4ade80;
            color: #000;
            border-color: #4ade80;
        }

        .music-slider {
            width: 100%;
            margin-top: 8px;
            margin-bottom: 8px;
            height: 44px;
            padding: 10px 0;
            cursor: pointer;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .volume-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-controls .music-slider {
            flex: 1;
        }

        .volume-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .volume-btn:active {
            background: var(--button-bg);
            color: var(--button-text);
        }

        /* 音樂播放指示器 */
        .music-indicator {
            position: fixed;
            top: 70px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(74, 222, 128, 0.35);
            color: #000;
            border-radius: 50%;
            font-size: 14px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99;
            cursor: pointer;
            transition: all 0.2s;
        }

        .music-indicator:hover {
            background: rgba(74, 222, 128, 0.7);
        }

        .music-indicator.show {
            display: flex;
        }

        /* 手機版指示器位置調整 */
        @media (max-width: 1024px) {
            .scroll-indicator {
                top: 65px;
                right: 5px;
                width: 32px;
                height: 32px;
            }
            .tts-indicator {
                top: 65px;
                right: 5px;
                width: 32px;
                height: 32px;
            }
            .music-indicator {
                top: 65px;
                right: 5px;
                width: 32px;
                height: 32px;
            }
        }

        /* 用戶選單 */
        .user-menu {
            position: relative;
            display: flex;
            align-items: center;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border-color);
            box-sizing: border-box;
        }

        @media (max-width: 1024px) {
            .user-avatar {
                width: 36px;
                height: 36px;
            }
        }

        .user-dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 0;
            min-width: 150px;
            box-shadow: 0 4px 20px var(--shadow);
            display: none;
            z-index: 102;
        }

        .user-dropdown.show {
            display: block;
        }

        .user-dropdown-item {
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.2s;
            display: block;
            text-decoration: none;
            color: var(--text-color);
        }

        .user-dropdown-item:hover {
            background: var(--bg-color);
        }

        /* RWD */
        @media (max-width: 1024px) {
            .header h1 {
                display: none;
            }
            
            .chapter-content {
                font-size: 16px;
            }
            
            .sidebar {
                width: 85%;
                left: -85%;
            }
            
            .btn {
                padding: 6px 10px;
                font-size: 13px;
            }
            
            /* 手機版隱藏設定按鈕 */
            .desktop-only {
                display: none !important;
            }
        }
        
        /* 電腦版隱藏選單內的設定項目 */
        @media (min-width: 1025px) {
            .mobile-only {
                display: none !important;
            }
        }
        
        /* 下拉選單分隔線 */
        .user-dropdown-divider {
            height: 1px;
            background: var(--border-color);
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <!-- 登入畫面 -->
    <div class="login-screen" id="loginScreen">
        <h2>📖 小說閱讀器</h2>
        <p style="margin-bottom: 30px; color: #888;">請登入以同步閱讀進度</p>
        <button class="login-btn" id="loginBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            使用 Google 登入
        </button>
    </div>

    <!-- 頂部導航 -->
    <header class="header" id="header" style="display: none;">
        <div class="header-left">
            <button class="btn btn-icon" id="menuBtn" title="章節目錄">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <h1 id="bookTitle">小說閱讀器</h1>
        </div>
        <div class="header-controls">
            <button class="btn btn-icon" id="quickTtsBtn" title="開始唸故事">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
            </button>
            <button class="btn btn-icon desktop-only" id="ttsBtn" title="唸故事設定">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
            <button class="btn btn-icon" id="musicBtn" title="背景音樂">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
            </button>
            <button class="btn btn-icon" id="quickScrollBtn" title="開始自動捲動">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </button>
            <button class="btn btn-icon desktop-only" id="scrollBtn" title="自動捲動設定">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithPopup, signOut, onAuthStateChanged, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getStorage, ref as storageRef, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        
        // Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyATCaOlYxkYTle1hPzYAcuXNlQHaAuO3-8",
            authDomain: "case-scheduler-f752b.firebaseapp.com",
            databaseURL: "https://case-scheduler-f752b-default-rtdb.firebaseio.com",
            projectId: "case-scheduler-f752b",
            storageBucket: "case-scheduler-f752b.firebasestorage.app",
            messagingSenderId: "703006186929",
            appId: "1:703006186929:web:57ac5b059678005455f190"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();
        
        // ============ 狀態 ============
        let currentUser = null;
        let chapters = [];
        let totalChapters = 0;
        let currentChapterIndex = 1;
        let fontSize = 20;
        let fontWeight = 500;
        let isDarkMode = false;
        
        // 自動捲動狀態
        let autoScrollInterval = null;
        let scrollIntervalTime = 15;  // 秒（預設15）
        let scrollSpeed = 4;          // 秒（預設4）
        let scrollLines = 6;          // 行（預設6）
        let isAutoScrolling = false;  // 用來暫停工具列偵測
        
        // 書籤狀態
        let currentBookmark = null;

        // TTS 狀態
        let ttsVoices = [];
        let ttsSelectedVoice = null;
        let ttsRate = 1;
        let ttsSpeaking = false;
        let ttsCurrentParagraphIndex = 0;

        // ============ DOM 元素 ============
        const loginScreen = document.getElementById('loginScreen');
        const loginBtn = document.getElementById('loginBtn');
        const header = document.getElementById('header');
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const themeToggle = document.getElementById('themeToggle');
        const fontBtn = document.getElementById('fontBtn');
        const fontPopup = document.getElementById('fontPopup');
        const fontSlider = document.getElementById('fontSlider');
        const fontSizeDisplay = document.getElementById('fontSizeDisplay');
        const mainContent = document.getElementById('mainContent');
        const chapterView = document.getElementById('chapterView');
        const chapterTitle = document.getElementById('chapterTitle');
        const chapterContent = document.getElementById('chapterContent');
        const chapterList = document.getElementById('chapterList');
        const footerNav = document.getElementById('footerNav');
        const prevBtn = document.getElementById('prevChapter');
        const nextBtn = document.getElementById('nextChapter');
        const chapterProgress = document.getElementById('chapterProgress');
        const bookTitle = document.getElementById('bookTitle');
        const loadingScreen = document.getElementById('loadingScreen');
        const userAvatar = document.getElementById('userAvatar');
        const userDropdown = document.getElementById('userDropdown');
        const logoutBtn = document.getElementById('logoutBtn');
        const quickScrollBtn = document.getElementById('quickScrollBtn');
        const scrollBtn = document.getElementById('scrollBtn');
        const scrollPopup = document.getElementById('scrollPopup');
        const scrollStartBtn = document.getElementById('scrollStartBtn');
        const scrollIndicator = document.getElementById('scrollIndicator');
        const bookmarkBtn = document.getElementById('bookmarkBtn');
        
        // TTS DOM 元素
        const quickTtsBtn = document.getElementById('quickTtsBtn');
        const ttsBtn = document.getElementById('ttsBtn');
        const ttsPopup = document.getElementById('ttsPopup');
        const voiceSelect = document.getElementById('voiceSelect');
        const ttsRateValue = document.getElementById('ttsRateValue');
        const ttsStartBtn = document.getElementById('ttsStartBtn');
        const ttsIndicator = document.getElementById('ttsIndicator');

        // ============ 登入狀態監聽 ============
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginScreen.style.display = 'none';
                header.style.display = 'flex';
                mainContent.classList.add('show');
                footerNav.classList.add('show');
                
                userAvatar.src = user.photoURL || '';
                
                // 載入小說
                await loadNovel();
            } else {
                currentUser = null;
                loginScreen.style.display = 'flex';
                header.style.display = 'none';
                mainContent.classList.remove('show');
                footerNav.classList.remove('show');
            }
        });

        // 登入
        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error('登入失敗:', error);
                alert('登入失敗，請重試');
            }
        });

        // 用戶選單
        userAvatar.addEventListener('click', () => {
            userDropdown.classList.toggle('show');
        });

        // 登出
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            userDropdown.classList.remove('show');
        });

        // 手機版選單項目點擊
        const menuTtsSettings = document.getElementById('menuTtsSettings');
        const menuScrollSettings = document.getElementById('menuScrollSettings');
        const menuFontSettings = document.getElementById('menuFontSettings');
        const menuThemeToggle = document.getElementById('menuThemeToggle');

        menuTtsSettings.addEventListener('click', () => {
            userDropdown.classList.remove('show');
            ttsPopup.classList.toggle('show');
        });

        menuScrollSettings.addEventListener('click', () => {
            userDropdown.classList.remove('show');
            scrollPopup.classList.toggle('show');
        });

        menuFontSettings.addEventListener('click', () => {
            userDropdown.classList.remove('show');
            fontPopup.classList.toggle('show');
        });

        menuThemeToggle.addEventListener('click', () => {
            userDropdown.classList.remove('show');
            toggleTheme();
        });

        // 點其他地方關閉選單
        document.addEventListener('click', (e) => {
            if (!userAvatar.contains(e.target) && !userDropdown.contains(e.target)) {
                userDropdown.classList.remove('show');
            }
            // 手機版從選單開啟的 popup 不要立即關閉
            const menuMusicSettingsEl = document.getElementById('menuMusicSettings');
            const musicBtnEl = document.getElementById('musicBtn');
            const musicPopupEl = document.getElementById('musicPopup');
            
            if (!fontPopup.contains(e.target) && !fontBtn.contains(e.target) && !menuFontSettings.contains(e.target)) {
                fontPopup.classList.remove('show');
            }
            if (!scrollPopup.contains(e.target) && !scrollBtn.contains(e.target) && !menuScrollSettings.contains(e.target)) {
                scrollPopup.classList.remove('show');
            }
            if (!ttsPopup.contains(e.target) && !ttsBtn.contains(e.target) && !menuTtsSettings.contains(e.target)) {
                ttsPopup.classList.remove('show');
            }
            if (musicPopupEl && musicBtnEl && menuMusicSettingsEl) {
                if (!musicPopupEl.contains(e.target) && !musicBtnEl.contains(e.target) && !menuMusicSettingsEl.contains(e.target)) {
                    musicPopupEl.classList.remove('show');
                }
            }
        });

        // ============ 載入小說 ============
        async function loadNovel() {
            loadSettings();
            
            // 載入小說資訊
            const infoSnap = await get(ref(db, 'novel/info'));
            if (infoSnap.exists()) {
                const info = infoSnap.val();
                bookTitle.textContent = info.title || '小說閱讀器';
                totalChapters = info.totalChapters || 0;
            }
            
            // 載入章節目錄
            const chaptersSnap = await get(ref(db, 'novel/chapters'));
            if (chaptersSnap.exists()) {
                const data = chaptersSnap.val();
                chapters = Object.keys(data).map(key => ({
                    num: parseInt(key),
                    title: data[key].title
                })).sort((a, b) => a.num - b.num);
                
                totalChapters = chapters.length;
                renderChapterList();
            }
            
            // 載入閱讀進度
            const progressSnap = await get(ref(db, 'novel/progress'));
            if (progressSnap.exists()) {
                currentChapterIndex = progressSnap.val().chapter || chapters[0]?.num || 1;
            } else if (chapters.length > 0) {
                currentChapterIndex = chapters[0].num;
            }
            
            // 顯示章節
            if (chapters.length > 0) {
                loadingScreen.style.display = 'none';
                showChapter(currentChapterIndex);
            } else {
                loadingScreen.innerHTML = `
                    <p>尚未上傳小說</p>
                    <p style="margin-top: 20px;">
                        <a href="novel-uploader.html" style="color: #4a90d9;">👉 前往上傳</a>
                    </p>
                `;
            }
        }

        // ============ 開關燈 ============
        function updateThemeIcon() {
            const moonIcon = themeToggle.querySelector('.icon-moon');
            const sunIcon = themeToggle.querySelector('.icon-sun');
            if (isDarkMode) {
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
            } else {
                moonIcon.style.display = 'block';
                sunIcon.style.display = 'none';
            }
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
            updateThemeIcon();
            localStorage.setItem('novel-theme', isDarkMode ? 'dark' : 'light');
        }

        themeToggle.addEventListener('click', toggleTheme);

        // ============ 側邊欄 ============
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // ============ 字體控制 ============
        const fontMinus = document.getElementById('fontMinus');
        const fontPlus = document.getElementById('fontPlus');

        fontBtn.addEventListener('click', () => {
            fontPopup.classList.toggle('show');
            scrollPopup.classList.remove('show');
        });

        function updateFontSize(newSize) {
            // 確保在 18-40 範圍內，且是偶數
            fontSize = Math.max(18, Math.min(40, newSize));
            if (fontSize % 2 !== 0) fontSize = fontSize - 1;
            fontSizeDisplay.textContent = fontSize;
            fontSlider.value = fontSize;
            chapterContent.style.fontSize = fontSize + 'px';
            localStorage.setItem('novel-fontSize', fontSize);
        }

        fontSlider.addEventListener('input', (e) => {
            updateFontSize(parseInt(e.target.value));
        });

        fontMinus.addEventListener('click', () => {
            updateFontSize(fontSize - 2);
        });

        fontPlus.addEventListener('click', () => {
            updateFontSize(fontSize + 2);
        });

        // ============ 字體粗度控制 ============
        const weightBtns = document.querySelectorAll('.weight-btn');
        
        function updateFontWeight(weight) {
            fontWeight = weight;
            chapterContent.style.fontWeight = weight;
            localStorage.setItem('novel-fontWeight', weight);
            
            weightBtns.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.weight) === weight);
            });
        }

        weightBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                updateFontWeight(parseInt(btn.dataset.weight));
            });
        });

        // ============ 自動捲動控制 ============
        scrollBtn.addEventListener('click', () => {
            scrollPopup.classList.toggle('show');
            fontPopup.classList.remove('show');
        });

        // 選項按鈕
        document.querySelectorAll('.scroll-opt[data-interval]').forEach(btn => {
            btn.addEventListener('click', () => {
                scrollIntervalTime = parseFloat(btn.dataset.interval);
                document.querySelectorAll('.scroll-opt[data-interval]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                localStorage.setItem('novel-scrollInterval', scrollIntervalTime);
            });
        });

        document.querySelectorAll('.scroll-opt[data-speed]').forEach(btn => {
            btn.addEventListener('click', () => {
                scrollSpeed = parseFloat(btn.dataset.speed);
                document.querySelectorAll('.scroll-opt[data-speed]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                localStorage.setItem('novel-scrollSpeed', scrollSpeed);
            });
        });

        document.querySelectorAll('.scroll-opt[data-lines]').forEach(btn => {
            btn.addEventListener('click', () => {
                scrollLines = parseInt(btn.dataset.lines);
                document.querySelectorAll('.scroll-opt[data-lines]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                localStorage.setItem('novel-scrollLines', scrollLines);
            });
        });

        // 開始/停止自動捲動
        function smoothScrollBy(distance, duration) {
            const start = window.scrollY;
            const startTime = performance.now();
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // easeInOutCubic 緩動函數
                const easeProgress = progress < 0.5
                    ? 4 * progress * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;
                
                window.scrollTo(0, start + distance * easeProgress);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            
            requestAnimationFrame(animate);
        }

        function startAutoScroll() {
            if (autoScrollInterval) return;
            
            isAutoScrolling = true;
            
            function doScroll() {
                // 每次捲動時即時計算，這樣調整參數會立即生效
                const lineHeightRatio = window.innerWidth >= 1024 ? 1.5 : 1.7;
                const lineHeight = fontSize * lineHeightRatio;
                const scrollDistance = lineHeight * scrollLines;
                
                smoothScrollBy(scrollDistance, scrollSpeed * 1000);
                
                // 檢查是否到底部
                if ((window.innerHeight + window.scrollY) >= document.body.scrollHeight - 100) {
                    stopAutoScroll();
                }
            }
            
            // 使用 setTimeout 遞迴，這樣每次都能用最新的 scrollIntervalTime
            function scheduleNext() {
                autoScrollInterval = setTimeout(() => {
                    if (isAutoScrolling) {
                        doScroll();
                        scheduleNext();
                    }
                }, scrollIntervalTime * 1000);
            }
            
            // 立即執行第一次，然後開始排程
            doScroll();
            scheduleNext();
            
            scrollStartBtn.textContent = '⏹️ 停止自動捲動';
            scrollStartBtn.classList.add('active');
            scrollIndicator.classList.add('show');
            scrollPopup.classList.remove('show');
            
            // 更新指示器位置
            if (typeof updateIndicatorPositions === 'function') {
                updateIndicatorPositions();
            }
            
            // 快捷按鈕變暗
            quickScrollBtn.style.opacity = '0.4';
            quickScrollBtn.style.pointerEvents = 'none';
            
            // 只在手機版自動收起工具列
            if (window.innerWidth <= 1024) {
                header.classList.add('hidden');
                footerNav.classList.add('hidden');
            }
        }

        function stopAutoScroll() {
            if (autoScrollInterval) {
                clearTimeout(autoScrollInterval);
                autoScrollInterval = null;
            }
            isAutoScrolling = false;
            scrollStartBtn.textContent = '▶️ 開始自動捲動';
            scrollStartBtn.classList.remove('active');
            scrollIndicator.classList.remove('show');
            
            // 更新指示器位置
            if (typeof updateIndicatorPositions === 'function') {
                updateIndicatorPositions();
            }
            
            // 快捷按鈕恢復
            quickScrollBtn.style.opacity = '1';
            quickScrollBtn.style.pointerEvents = 'auto';
        }

        scrollStartBtn.addEventListener('click', () => {

            } else {

        });

        // ============ 章節目錄 ============
        function renderChapterList() {
            chapterList.innerHTML = chapters.map(ch => 
                `<li data-num="${ch.num}" class="${ch.num === currentChapterIndex ? 'active' : ''}">${ch.title}</li>`
            ).join('');

            chapterList.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', () => {
                    showChapter(parseInt(li.dataset.num));
                    toggleSidebar();
                });
            });

        // ============ 顯示章節 ============
        async function showChapter(num) {
            // 檢查章節是否存在
            const chapterExists = chapters.some(ch => ch.num === num);
            if (!chapterExists) return;

            currentChapterIndex = num;
            
            const snap = await get(ref(db, `novel/chapters/${num}`));
            if (!snap.exists()) return;
            
            const chapter = snap.val();
            
            chapterTitle.textContent = chapter.title;
            
            const paragraphs = chapter.content
                .split(/\n\s*\n/)
                .filter(p => p.trim())
                .map((p, i) => `<p data-index="${i}">${p.trim()}</p>`)
                .join('');
            
            chapterContent.innerHTML = paragraphs || `<p data-index="0">${chapter.content}</p>`;
            chapterContent.style.fontSize = fontSize + 'px';
            chapterContent.style.fontWeight = fontWeight;
            
            chapterView.style.display = 'block';

            // 顯示進度（章節號 + 本章閱讀百分比）
            updateProgress();

            chapterList.querySelectorAll('li').forEach(li => {
                li.classList.toggle('active', parseInt(li.dataset.num) === num);
            });

            window.scrollTo(0, 0);
            
            // 載入書籤
            await loadBookmark();

            // 儲存進度
            await set(ref(db, 'novel/progress'), {
                chapter: num,
                updatedAt: Date.now()
            });
        }
        
        // 更新閱讀進度百分比
        function updateProgress() {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const percent = docHeight > 0 ? Math.round((scrollTop / docHeight) * 100) : 0;
            chapterProgress.textContent = `${currentChapterIndex} 章 (${percent}%)`;
        }

        // ============ 上下章 ============
        function goToPrevChapter() {
            const currentIndex = chapters.findIndex(ch => ch.num === currentChapterIndex);
            if (currentIndex > 0) {
                showChapter(chapters[currentIndex - 1].num);
            }
        }

        function goToNextChapter() {
            const currentIndex = chapters.findIndex(ch => ch.num === currentChapterIndex);
            if (currentIndex < chapters.length - 1) {
                showChapter(chapters[currentIndex + 1].num);
            }
        }

        prevBtn.addEventListener('click', goToPrevChapter);
        nextBtn.addEventListener('click', goToNextChapter);

        // 鍵盤快捷鍵
        document.addEventListener('keydown', (e) => {
            if (chapters.length === 0) return;
            
            if (e.key === 'ArrowLeft') {
                goToPrevChapter();
            } else if (e.key === 'ArrowRight') {
                goToNextChapter();
            }
        });

        // ============ 滑動隱藏工具列（只在手機版） ============
        let lastScrollY = 0;
        let ticking = false;
        const hideThreshold = 50;  // 往下滑 50px 就隱藏（敏感）
        const showThreshold = 120; // 往上滑 120px 才顯示（不敏感）

        function handleScroll() {
            // 更新閱讀進度
            updateProgress();
            
            // 電腦版不自動隱藏工具列
            if (window.innerWidth > 1024) {
                ticking = false;
                return;
            }
            
            // 自動捲動時不處理工具列隱藏
            if (isAutoScrolling) {
                lastScrollY = window.scrollY;
                ticking = false;
                return;
            }
            
            const currentScrollY = window.scrollY;
            const scrollDiff = currentScrollY - lastScrollY;
            
            if (scrollDiff > hideThreshold && currentScrollY > 100) {
                // 往下滑超過門檻 - 隱藏工具列
                header.classList.add('hidden');
                footerNav.classList.add('hidden');
                lastScrollY = currentScrollY;
            } else if (scrollDiff < -showThreshold) {
                // 往上滑超過門檻 - 顯示工具列
                header.classList.remove('hidden');
                footerNav.classList.remove('hidden');
                lastScrollY = currentScrollY;
            }
            
            ticking = false;
        }

        window.addEventListener('scroll', () => {
            if (!ticking) {
                requestAnimationFrame(handleScroll);
                ticking = true;
            }
        });

        // 點擊畫面中間也可以顯示/隱藏工具列（只在手機版）
        mainContent.addEventListener('click', (e) => {
            if (window.innerWidth > 1024) return;
            if (e.target === chapterContent || chapterContent.contains(e.target)) {
                header.classList.toggle('hidden');
                footerNav.classList.toggle('hidden');
            }
        });
        
        // ============ 書籤功能 ============
        // 取得畫面中央的段落
        function getCenterParagraph() {
            const paragraphs = chapterContent.querySelectorAll('p');
            const viewportCenter = window.scrollY + window.innerHeight / 2;
            
            let closestP = null;
            let closestDistance = Infinity;
            
            paragraphs.forEach(p => {
                const rect = p.getBoundingClientRect();
                const pCenter = window.scrollY + rect.top + rect.height / 2;
                const distance = Math.abs(pCenter - viewportCenter);
                
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestP = p;
                }
            });
            
            return closestP;
        }
        
        // 顯示書籤直線
        function showBookmarkLine(paragraphIndex) {
            // 移除舊的書籤線
            const oldLine = chapterContent.querySelector('.bookmark-line');
            if (oldLine) oldLine.remove();
            
            const p = chapterContent.querySelector(`p[data-index="${paragraphIndex}"]`);
            if (!p) return;
            
            const line = document.createElement('div');
            line.className = 'bookmark-line';
            line.style.top = p.offsetTop + 'px';
            line.style.height = p.offsetHeight + 'px';
            chapterContent.appendChild(line);
            
            bookmarkBtn.classList.add('active');
        }
        
        // 清除書籤直線
        function clearBookmarkLine() {
            const line = chapterContent.querySelector('.bookmark-line');
            if (line) line.remove();
            bookmarkBtn.classList.remove('active');
        }
        
        // 載入書籤
        async function loadBookmark() {
            clearBookmarkLine();
            currentBookmark = null;
            
            const snap = await get(ref(db, 'novel/bookmark'));
            if (snap.exists()) {
                const bookmark = snap.val();
                if (bookmark.chapter === currentChapterIndex) {
                    currentBookmark = bookmark;
                    showBookmarkLine(bookmark.paragraph);
                    
                    // 自動跳到書籤位置
                    const p = chapterContent.querySelector(`p[data-index="${bookmark.paragraph}"]`);
                    if (p) {
                        setTimeout(() => {
                            p.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 300);
                    }
                }
            }
        }
        
        // 儲存書籤
        async function saveBookmark(paragraphIndex) {
            currentBookmark = {
                chapter: currentChapterIndex,
                paragraph: paragraphIndex,
                updatedAt: Date.now()
            };
            
            await set(ref(db, 'novel/bookmark'), currentBookmark);
            showBookmarkLine(paragraphIndex);
        }
        
        // 刪除書籤
        async function removeBookmark() {
            currentBookmark = null;
            await set(ref(db, 'novel/bookmark'), null);
            clearBookmarkLine();
        }
        
        // 書籤按鈕點擊
        bookmarkBtn.addEventListener('click', async () => {
            if (currentBookmark && currentBookmark.chapter === currentChapterIndex) {
                // 已有書籤，刪除
                await removeBookmark();
            } else {
                // 新增書籤到畫面中央段落
                const centerP = getCenterParagraph();
                if (centerP) {
                    const index = parseInt(centerP.dataset.index);
                    await saveBookmark(index);
                }
            }
        });

        // ============ TTS 唸故事功能 ============
        
        // 載入語音列表
        function loadTtsVoices() {
            const voices = speechSynthesis.getVoices();
            
            // 篩選中文語音
            ttsVoices = voices.filter(v => 
                v.lang.includes('zh') || 
                v.lang.includes('cmn') ||
                v.name.toLowerCase().includes('chinese') ||
                v.name.includes('中文')
            );
            
            if (ttsVoices.length === 0) {
                voiceSelect.innerHTML = '<option value="">無可用中文語音</option>';
                return;
            }
            
            // 更新下拉選單
            voiceSelect.innerHTML = ttsVoices.map((v, i) => {
                const region = v.lang.includes('TW') ? '(台灣)' 
                    : v.lang.includes('HK') ? '(香港)' 
                    : v.lang.includes('CN') ? '(中國)' 
                    : '';
                return `<option value="${i}">${v.name} ${region}</option>`;
            }).join('');
            
            // 載入儲存的語音偏好
            const savedVoiceIndex = localStorage.getItem('novel-ttsVoice');
            if (savedVoiceIndex && parseInt(savedVoiceIndex) < ttsVoices.length) {
                voiceSelect.value = savedVoiceIndex;
                ttsSelectedVoice = ttsVoices[parseInt(savedVoiceIndex)];
            } else {
                ttsSelectedVoice = ttsVoices[0];
            }
        }
        
        // 語音載入（有些瀏覽器需要等待）
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadTtsVoices;
        }
        loadTtsVoices();
        setTimeout(loadTtsVoices, 100);
        setTimeout(loadTtsVoices, 500);
        
        // 語音選擇變更
        voiceSelect.addEventListener('change', () => {
            const index = parseInt(voiceSelect.value);
            if (!isNaN(index) && ttsVoices[index]) {
                ttsSelectedVoice = ttsVoices[index];
                localStorage.setItem('novel-ttsVoice', index);
            }
        });
        
        // 語速選擇
        document.querySelectorAll('.tts-rate-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                ttsRate = parseFloat(btn.dataset.rate);
                ttsRateValue.textContent = ttsRate + 'x';
                document.querySelectorAll('.tts-rate-opt').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                localStorage.setItem('novel-ttsRate', ttsRate);
            });
        });
        
        // 載入 TTS 設定
        function loadTtsSettings() {
            const savedRate = localStorage.getItem('novel-ttsRate');
            if (savedRate) {
                ttsRate = parseFloat(savedRate);
                ttsRateValue.textContent = ttsRate + 'x';
            }
            
            // 更新按鈕狀態
            document.querySelectorAll('.tts-rate-opt').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.rate) === ttsRate);
            });
        }
        loadTtsSettings();
        
        // 清除 highlight
        function clearTtsHighlight() {
            chapterContent.querySelectorAll('p.tts-speaking').forEach(p => {
                p.classList.remove('tts-speaking');
            });
        }
        
        // 唸一個段落
        function speakParagraph(index) {
            const paragraphs = chapterContent.querySelectorAll('p');
            if (index >= paragraphs.length) {
                // 唸完了
                stopTts();
                return;
            }
            
            const p = paragraphs[index];
            const text = p.textContent.trim();
            
            if (!text) {
                // 空段落，跳到下一個
                speakParagraph(index + 1);
                return;
            }
            
            // Highlight 目前段落
            clearTtsHighlight();
            p.classList.add('tts-speaking');
            
            // 捲動到該段落
            p.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // 建立語音
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.voice = ttsSelectedVoice;
            utterance.lang = 'zh-TW';
            utterance.rate = ttsRate;
            
            utterance.onend = () => {
                if (ttsSpeaking) {
                    ttsCurrentParagraphIndex = index + 1;
                    speakParagraph(ttsCurrentParagraphIndex);
                }
            };
            
            utterance.onerror = (e) => {
                console.error('TTS error:', e);
                if (ttsSpeaking) {
                    ttsCurrentParagraphIndex = index + 1;
                    speakParagraph(ttsCurrentParagraphIndex);
                }
            };
            
            speechSynthesis.speak(utterance);
        }
        
        // 開始唸故事
        function startTts() {
            if (ttsVoices.length === 0) {
                alert('沒有可用的中文語音');
                return;
            }
            
            ttsSpeaking = true;
            
            // 從畫面中央的段落開始
            const centerP = getCenterParagraph();
            if (centerP) {
                ttsCurrentParagraphIndex = parseInt(centerP.dataset.index);
            } else {
                ttsCurrentParagraphIndex = 0;
            }
            
            speakParagraph(ttsCurrentParagraphIndex);
            
            // UI 更新
            ttsStartBtn.textContent = '⏹️ 停止唸故事';
            ttsStartBtn.classList.add('active');
            ttsIndicator.classList.add('show');
            ttsPopup.classList.remove('show');
            
            // 快捷按鈕變暗
            quickTtsBtn.style.opacity = '0.4';
            quickTtsBtn.style.pointerEvents = 'none';
            
            // 只在手機版收起工具列
            if (window.innerWidth <= 1024) {
                header.classList.add('hidden');
                footerNav.classList.add('hidden');
            }
        }
        
        // 停止唸故事
        function stopTts() {
            ttsSpeaking = false;
            speechSynthesis.cancel();
            clearTtsHighlight();
            
            // UI 更新
            ttsStartBtn.textContent = '🔊 開始唸故事';
            ttsStartBtn.classList.remove('active');
            ttsIndicator.classList.remove('show');
            
            // 快捷按鈕恢復
            quickTtsBtn.style.opacity = '1';
            quickTtsBtn.style.pointerEvents = 'auto';
        }
        
        // 設定按鈕
        ttsBtn.addEventListener('click', () => {
            ttsPopup.classList.toggle('show');
            fontPopup.classList.remove('show');
            scrollPopup.classList.remove('show');
        });
        
        // 開始/停止按鈕
        ttsStartBtn.addEventListener('click', () => {
            if (ttsSpeaking) {
                stopTts();
            } else {
                startTts();
            }
        });
        
        // 快捷按鈕
        quickTtsBtn.addEventListener('click', () => {
            startTts();
        });
        
        // 指示器點擊停止
        ttsIndicator.addEventListener('click', stopTts);
        
        // 切換章節時停止 TTS
        const originalShowChapter = showChapter;
        showChapter = async function(num) {
            if (ttsSpeaking) {
                stopTts();
            }
            return originalShowChapter(num);
        };

        // ============ 背景音樂功能 ============
        const musicBtn = document.getElementById('musicBtn');
        const musicPopup = document.getElementById('musicPopup');
        const musicPlayBtn = document.getElementById('musicPlayBtn');
        const musicVolumeSlider = document.getElementById('musicVolumeSlider');
        const musicVolumeValue = document.getElementById('musicVolumeValue');
        const musicIndicator = document.getElementById('musicIndicator');
        const bgMusic = document.getElementById('bgMusic');
        const menuMusicSettings = document.getElementById('menuMusicSettings');
        
        let currentMusicPath = null;
        let isMusicPlaying = false;

        // 音量控制
        function updateVolume() {
            const volume = musicVolumeSlider.value;
            musicVolumeValue.textContent = volume + '%';
            bgMusic.volume = volume / 100;
            localStorage.setItem('novel-musicVolume', volume);
        }
        
        musicVolumeSlider.addEventListener('input', updateVolume);
        musicVolumeSlider.addEventListener('change', updateVolume);
        musicVolumeSlider.addEventListener('touchmove', (e) => {
            e.stopPropagation();
            updateVolume();

        musicVolumeSlider.addEventListener('touchend', updateVolume);

        // 音量按鈕
        const volumeDown = document.getElementById('volumeDown');
        const volumeUp = document.getElementById('volumeUp');

        volumeDown.addEventListener('click', () => {
            let vol = parseInt(musicVolumeSlider.value) - 10;
            if (vol < 0) vol = 0;
            musicVolumeSlider.value = vol;
            updateVolume();
        });

        volumeUp.addEventListener('click', () => {

        // 播放/停止
        async function playMusic() {
            if (!currentMusicPath) {
                alert('請先選擇一首音樂');
                return;
            }
            
            if (!currentUser) {
                alert('請先登入才能播放音樂');
                return;
            }
            
            try {
                // 從 Firebase Storage 取得下載 URL
                const musicRef = storageRef(storage, currentMusicPath);
                const url = await getDownloadURL(musicRef);
                
                // 如果換歌，先停止目前的
                if (bgMusic.src && bgMusic.src !== url) {
                    bgMusic.pause();
                }
                
                bgMusic.src = url;
                bgMusic.volume = musicVolumeSlider.value / 100;
                
                // 更新 UI 狀態
                isMusicPlaying = true;
                musicPlayBtn.textContent = '⏹️ 停止';
                musicPlayBtn.classList.add('active');
                musicIndicator.classList.add('show');
                
                // 更新音樂項目狀態
                document.querySelectorAll('.music-item').forEach(i => {
                    i.classList.remove('playing');
                    if (i.dataset.path === currentMusicPath) {
                        i.classList.add('playing');
                    }
                });
            
                updateIndicatorPositions();
                
                bgMusic.play().catch(err => {
                    console.error('播放失敗:', err);
                    stopMusic();
                });
                
                musicPopup.classList.remove('show');
            } catch (err) {
                console.error('取得音樂失敗:', err);
                if (err.code === 'storage/unauthorized') {
                    alert('沒有權限播放音樂');
                } else if (err.code === 'storage/object-not-found') {
                    alert('找不到音樂檔案，請確認 Firebase Storage 中有上傳 music/ 資料夾');
                } else {
                    alert('播放失敗: ' + err.message);
                }
            }
        }

        function stopMusic() {
            bgMusic.pause();
            bgMusic.currentTime = 0;
            
            isMusicPlaying = false;
            musicPlayBtn.textContent = '▶️ 播放';
            musicPlayBtn.classList.remove('active');
            musicIndicator.classList.remove('show');
            
            document.querySelectorAll('.music-item').forEach(i => {
                i.classList.remove('playing');
            });
            
            updateIndicatorPositions();
        }

        // 動態調整指示器位置
        function updateIndicatorPositions() {
            const scrollShowing = scrollIndicator.classList.contains('show');
            const musicShowing = musicIndicator.classList.contains('show');
            const isMobile = window.innerWidth <= 1024;
            
            const baseTop = isMobile ? 65 : 70;
            const gap = isMobile ? 38 : 45;
            
            // 捲動指示器永遠在最上面
            scrollIndicator.style.top = baseTop + 'px';
            
            // 音樂指示器：有捲動時往下移
            if (scrollShowing && musicShowing) {
                musicIndicator.style.top = (baseTop + gap) + 'px';
            } else {
                musicIndicator.style.top = baseTop + 'px';
            }
        }

        // 點擊歌曲時，如果正在播放就自動切換
        document.querySelectorAll('.music-item').forEach(item => {
            item.addEventListener('click', () => {
                const wasPlaying = isMusicPlaying;
                const newPath = item.dataset.path;
                
                // 更新選擇狀態
                document.querySelectorAll('.music-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentMusicPath = newPath;
                localStorage.setItem('novel-musicPath', currentMusicPath);
                
                // 如果正在播放，自動切換到新歌
                if (wasPlaying) {
                    playMusic();
                }
            });
        });

        musicPlayBtn.addEventListener('click', () => {
            if (isMusicPlaying) {
                stopMusic();
            } else {
                playMusic();
            }
        });

        // 音樂按鈕點擊（電腦版）
        musicBtn.addEventListener('click', () => {
            musicPopup.classList.toggle('show');
            fontPopup.classList.remove('show');
            scrollPopup.classList.remove('show');
            ttsPopup.classList.remove('show');
        });

        // 音樂指示器點擊停止
        musicIndicator.addEventListener('click', stopMusic);

        // 手機版選單
        menuMusicSettings.addEventListener('click', () => {
            userDropdown.classList.remove('show');
            musicPopup.classList.toggle('show');
        });

        // 載入音樂設定
        function loadMusicSettings() {
            const savedMusicPath = localStorage.getItem('novel-musicPath');
            if (savedMusicPath) {
                currentMusicPath = savedMusicPath;
                document.querySelectorAll('.music-item').forEach(i => {
                    i.classList.toggle('active', i.dataset.path === savedMusicPath);
                });
            }
            
            const savedVolume = localStorage.getItem('novel-musicVolume');
            if (savedVolume) {
                musicVolumeSlider.value = savedVolume;
                musicVolumeValue.textContent = savedVolume + '%';
            }
        }
        loadMusicSettings();
    </script>
</body>
</html>
