<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小說閱讀器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 淺色模式 */
        :root {
            --bg-color: #f5f5dc;
            --text-color: #333;
            --header-bg: #fff;
            --border-color: #ddd;
            --button-bg: #4a4a4a;
            --button-text: #fff;
            --chapter-bg: #fff;
            --shadow: rgba(0,0,0,0.1);
        }

        /* 深色模式 */
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #c0c0c0;
            --header-bg: #2d2d2d;
            --border-color: #444;
            --button-bg: #555;
            --button-text: #fff;
            --chapter-bg: #252525;
            --shadow: rgba(0,0,0,0.3);
        }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.9;
            transition: all 0.3s ease;
        }

        /* 頂部導航列 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 100;
            box-shadow: 0 2px 10px var(--shadow);
            transition: transform 0.3s ease;
        }

        .header.hidden {
            transform: translateY(-100%);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: normal;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* 按鈕樣式 */
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: var(--button-bg);
            color: var(--button-text);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 登入區 */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .login-screen h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .login-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 15px 30px;
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--shadow);
        }

        .login-btn img {
            width: 24px;
            height: 24px;
        }

        /* 側邊章節目錄 */
        .sidebar {
            position: fixed;
            top: 60px;
            left: -320px;
            width: 320px;
            height: calc(100vh - 60px);
            background: var(--header-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            transition: left 0.3s ease;
            z-index: 99;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            position: sticky;
            top: 0;
            background: var(--header-bg);
        }

        .chapter-list {
            list-style: none;
        }

        .chapter-list li {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }

        .chapter-list li:hover {
            background: var(--bg-color);
        }

        .chapter-list li.active {
            background: var(--button-bg);
            color: var(--button-text);
        }

        /* 遮罩 */
        .overlay {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 98;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* 主要內容區 */
        .main-content {
            max-width: 95%;
            margin: 0 auto;
            padding: 80px 20px 120px;
            display: none;
        }

        /* 響應式內容寬度 */
        @media (min-width: 768px) {
            .main-content {
                max-width: 85%;
            }
        }

        @media (min-width: 1024px) {
            .main-content {
                max-width: 70%;
            }
        }

        @media (min-width: 1440px) {
            .main-content {
                max-width: 60%;
            }
        }

        .main-content.show {
            display: block;
        }

        .chapter-title {
            font-size: 1.4rem;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            text-align: center;
        }

        .chapter-content {
            font-size: 18px;
            text-align: justify;
        }

        .chapter-content p {
            margin-bottom: 1.5em;
            text-indent: 2em;
        }

        /* 底部導航 */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: none;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .footer-nav.show {
            display: flex;
        }

        .footer-nav.hidden {
            transform: translateY(100%);
        }

        .chapter-progress {
            font-size: 14px;
            min-width: 80px;
            text-align: center;
        }

        /* 載入畫面 */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            color: #888;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top-color: var(--button-bg);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 字體控制彈窗 */
        .font-popup, .scroll-popup {
            position: fixed;
            top: 70px;
            right: 10px;
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 20px var(--shadow);
            display: none;
            z-index: 101;
            min-width: 200px;
        }

        .font-popup.show, .scroll-popup.show {
            display: block;
        }

        .popup-section {
            margin-bottom: 15px;
        }

        .popup-section:last-child {
            margin-bottom: 0;
        }

        .popup-section label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #888;
            text-align: center;
        }

        .font-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .font-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            background: var(--button-bg);
            color: var(--button-text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-btn:hover {
            opacity: 0.8;
        }

        .font-size-value {
            min-width: 50px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .font-slider {
            width: 100%;
        }

        /* 字體粗度控制 */
        .weight-controls {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .weight-btn {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: transparent;
            color: var(--text-color);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .weight-btn:hover {
            background: var(--bg-color);
        }

        .weight-btn.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: var(--button-bg);
        }

        /* 自動捲動控制 */
        .scroll-options {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .scroll-opt {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: transparent;
            color: var(--text-color);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scroll-opt:hover {
            background: var(--bg-color);
        }

        .scroll-opt.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: var(--button-bg);
        }

        .scroll-start-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #4ade80;
            color: #000;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scroll-start-btn:hover {
            background: #22c55e;
        }

        .scroll-start-btn.active {
            background: #f87171;
        }

        /* 自動捲動指示器 */
        .scroll-indicator {
            position: fixed;
            top: 70px;
            right: 15px;
            width: 36px;
            height: 36px;
            background: rgba(74, 222, 128, 0.6);
            color: #000;
            border-radius: 50%;
            font-size: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scroll-indicator:hover {
            background: rgba(74, 222, 128, 0.9);
        }

        .scroll-indicator.show {
            display: flex;
        }

        /* 用戶選單 */
        .user-menu {
            position: relative;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border-color);
        }

        .user-dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 0;
            min-width: 150px;
            box-shadow: 0 4px 20px var(--shadow);
            display: none;
            z-index: 102;
        }

        .user-dropdown.show {
            display: block;
        }

        .user-dropdown-item {
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.2s;
            display: block;
            text-decoration: none;
            color: var(--text-color);
        }

        .user-dropdown-item:hover {
            background: var(--bg-color);
        }

        /* RWD */
        @media (max-width: 600px) {
            .header h1 {
                max-width: 120px;
                font-size: 1rem;
            }
            
            .chapter-content {
                font-size: 16px;
            }
            
            .sidebar {
                width: 85%;
                left: -85%;
            }
            
            .btn {
                padding: 6px 10px;
                font-size: 13px;
            }
            
            .btn-icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- 登入畫面 -->
    <div class="login-screen" id="loginScreen">
        <h2>📖 小說閱讀器</h2>
        <p style="margin-bottom: 30px; color: #888;">請登入以同步閱讀進度</p>
        <button class="login-btn" id="loginBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            使用 Google 登入
        </button>
    </div>

    <!-- 頂部導航 -->
    <header class="header" id="header" style="display: none;">
        <div class="header-left">
            <button class="btn btn-icon" id="menuBtn" title="章節目錄">☰</button>
            <h1 id="bookTitle">小說閱讀器</h1>
        </div>
        <div class="header-controls">
            <button class="btn btn-icon" id="scrollBtn" title="自動捲動">📜</button>
            <button class="btn btn-icon" id="fontBtn" title="字體設定">A</button>
            <button class="btn btn-icon" id="themeToggle" title="開關燈">🌙</button>
            <div class="user-menu">
                <img class="user-avatar" id="userAvatar" src="" alt="頭像">
                <div class="user-dropdown" id="userDropdown">
                    <a class="user-dropdown-item" href="novel-uploader.html">📤 上傳章節</a>
                    <div class="user-dropdown-item" id="logoutBtn">🚪 登出</div>
                </div>
            </div>
        </div>
    </header>

    <!-- 字體控制 -->
    <div class="font-popup" id="fontPopup">
        <div class="popup-section">
            <label>字體大小</label>
            <div class="font-controls">
                <button class="font-btn" id="fontMinus">−</button>
                <span class="font-size-value" id="fontSizeDisplay">20</span>
                <button class="font-btn" id="fontPlus">+</button>
            </div>
            <input type="range" class="font-slider" id="fontSlider" min="14" max="28" value="20">
        </div>
        <div class="popup-section">
            <label>字體粗度</label>
            <div class="weight-controls">
                <button class="weight-btn" data-weight="400">正常</button>
                <button class="weight-btn" data-weight="500">中等</button>
                <button class="weight-btn" data-weight="600">半粗</button>
                <button class="weight-btn" data-weight="700">粗</button>
            </div>
        </div>
    </div>

    <!-- 自動捲動控制 -->
    <div class="scroll-popup" id="scrollPopup">
        <div class="popup-section">
            <label>⏱️ 每隔幾秒</label>
            <div class="scroll-options">
                <button class="scroll-opt" data-interval="2">2秒</button>
                <button class="scroll-opt" data-interval="5">5秒</button>
                <button class="scroll-opt" data-interval="8">8秒</button>
                <button class="scroll-opt" data-interval="10">10秒</button>
                <button class="scroll-opt" data-interval="15">15秒</button>
            </div>
        </div>
        <div class="popup-section">
            <label>🚀 動畫速度</label>
            <div class="scroll-options">
                <button class="scroll-opt" data-speed="1">1秒</button>
                <button class="scroll-opt" data-speed="2">2秒</button>
                <button class="scroll-opt" data-speed="3">3秒</button>
                <button class="scroll-opt" data-speed="4">4秒</button>
            </div>
        </div>
        <div class="popup-section">
            <label>📏 每次幾行</label>
            <div class="scroll-options">
                <button class="scroll-opt" data-lines="5">5行</button>
                <button class="scroll-opt" data-lines="10">10行</button>
                <button class="scroll-opt" data-lines="15">15行</button>
                <button class="scroll-opt" data-lines="20">20行</button>
            </div>
        </div>
        <button class="scroll-start-btn" id="scrollStartBtn">▶️ 開始自動捲動</button>
    </div>

    <!-- 側邊目錄 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">📚 章節目錄</div>
        <ul class="chapter-list" id="chapterList">
            <!-- 動態生成 -->
        </ul>
    </aside>

    <!-- 遮罩 -->
    <div class="overlay" id="overlay"></div>

    <!-- 主內容 -->
    <main class="main-content" id="mainContent">
        <div class="loading" id="loadingScreen">
            <div class="loading-spinner"></div>
            <p>正在載入小說...</p>
        </div>

        <article id="chapterView" style="display: none;">
            <h2 class="chapter-title" id="chapterTitle"></h2>
            <div class="chapter-content" id="chapterContent"></div>
        </article>
    </main>

    <!-- 底部導航 -->
    <nav class="footer-nav" id="footerNav">
        <button class="btn" id="prevChapter">⬅ 上一章</button>
        <span class="chapter-progress" id="chapterProgress">- / -</span>
        <button class="btn" id="nextChapter">下一章 ➡</button>
    </nav>

    <!-- 自動捲動指示器 -->
    <div class="scroll-indicator" id="scrollIndicator">⏸️</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithPopup, signOut, onAuthStateChanged, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        // Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyATCaOlYxkYTle1hPzYAcuXNlQHaAuO3-8",
            authDomain: "case-scheduler-f752b.firebaseapp.com",
            databaseURL: "https://case-scheduler-f752b-default-rtdb.firebaseio.com",
            projectId: "case-scheduler-f752b",
            storageBucket: "case-scheduler-f752b.firebasestorage.app",
            messagingSenderId: "703006186929",
            appId: "1:703006186929:web:57ac5b059678005455f190"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        
        // ============ 狀態 ============
        let currentUser = null;
        let chapters = [];
        let totalChapters = 0;
        let currentChapterIndex = 1;
        let fontSize = 20;
        let fontWeight = 500;
        let isDarkMode = false;
        
        // 自動捲動狀態
        let autoScrollInterval = null;
        let scrollIntervalTime = 8;  // 秒
        let scrollSpeed = 2;         // 秒
        let scrollLines = 10;        // 行
        let isAutoScrolling = false; // 用來暫停工具列偵測

        // ============ DOM 元素 ============
        const loginScreen = document.getElementById('loginScreen');
        const loginBtn = document.getElementById('loginBtn');
        const header = document.getElementById('header');
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const themeToggle = document.getElementById('themeToggle');
        const fontBtn = document.getElementById('fontBtn');
        const fontPopup = document.getElementById('fontPopup');
        const fontSlider = document.getElementById('fontSlider');
        const fontSizeDisplay = document.getElementById('fontSizeDisplay');
        const mainContent = document.getElementById('mainContent');
        const chapterView = document.getElementById('chapterView');
        const chapterTitle = document.getElementById('chapterTitle');
        const chapterContent = document.getElementById('chapterContent');
        const chapterList = document.getElementById('chapterList');
        const footerNav = document.getElementById('footerNav');
        const prevBtn = document.getElementById('prevChapter');
        const nextBtn = document.getElementById('nextChapter');
        const chapterProgress = document.getElementById('chapterProgress');
        const bookTitle = document.getElementById('bookTitle');
        const loadingScreen = document.getElementById('loadingScreen');
        const userAvatar = document.getElementById('userAvatar');
        const userDropdown = document.getElementById('userDropdown');
        const logoutBtn = document.getElementById('logoutBtn');
        const scrollBtn = document.getElementById('scrollBtn');
        const scrollPopup = document.getElementById('scrollPopup');
        const scrollStartBtn = document.getElementById('scrollStartBtn');
        const scrollIndicator = document.getElementById('scrollIndicator');

        // ============ 登入狀態監聽 ============
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginScreen.style.display = 'none';
                header.style.display = 'flex';
                mainContent.classList.add('show');
                footerNav.classList.add('show');
                
                userAvatar.src = user.photoURL || '';
                
                // 載入小說
                await loadNovel();
            } else {
                currentUser = null;
                loginScreen.style.display = 'flex';
                header.style.display = 'none';
                mainContent.classList.remove('show');
                footerNav.classList.remove('show');
            }
        });

        // 登入
        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error('登入失敗:', error);
                alert('登入失敗，請重試');
            }
        });

        // 用戶選單
        userAvatar.addEventListener('click', () => {
            userDropdown.classList.toggle('show');
        });

        // 登出
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            userDropdown.classList.remove('show');
        });

        // 點其他地方關閉選單
        document.addEventListener('click', (e) => {
            if (!userAvatar.contains(e.target) && !userDropdown.contains(e.target)) {
                userDropdown.classList.remove('show');
            }
            if (!fontPopup.contains(e.target) && e.target !== fontBtn) {
                fontPopup.classList.remove('show');
            }
            if (!scrollPopup.contains(e.target) && e.target !== scrollBtn) {
                scrollPopup.classList.remove('show');
            }
        });

        // ============ 載入小說 ============
        async function loadNovel() {
            loadSettings();
            
            // 載入小說資訊
            const infoSnap = await get(ref(db, 'novel/info'));
            if (infoSnap.exists()) {
                const info = infoSnap.val();
                bookTitle.textContent = info.title || '小說閱讀器';
                totalChapters = info.totalChapters || 0;
            }
            
            // 載入章節目錄
            const chaptersSnap = await get(ref(db, 'novel/chapters'));
            if (chaptersSnap.exists()) {
                const data = chaptersSnap.val();
                chapters = Object.keys(data).map(key => ({
                    num: parseInt(key),
                    title: data[key].title
                })).sort((a, b) => a.num - b.num);
                
                totalChapters = chapters.length;
                renderChapterList();
            }
            
            // 載入閱讀進度
            const progressSnap = await get(ref(db, 'novel/progress'));
            if (progressSnap.exists()) {
                currentChapterIndex = progressSnap.val().chapter || chapters[0]?.num || 1;
            } else if (chapters.length > 0) {
                currentChapterIndex = chapters[0].num;
            }
            
            // 顯示章節
            if (chapters.length > 0) {
                loadingScreen.style.display = 'none';
                showChapter(currentChapterIndex);
            } else {
                loadingScreen.innerHTML = `
                    <p>尚未上傳小說</p>
                    <p style="margin-top: 20px;">
                        <a href="novel-uploader.html" style="color: #4a90d9;">👉 前往上傳</a>
                    </p>
                `;
            }
        }

        // ============ 開關燈 ============
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
            themeToggle.textContent = isDarkMode ? '☀️' : '🌙';
            localStorage.setItem('novel-theme', isDarkMode ? 'dark' : 'light');
        }

        themeToggle.addEventListener('click', toggleTheme);

        // ============ 側邊欄 ============
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // ============ 字體控制 ============
        const fontMinus = document.getElementById('fontMinus');
        const fontPlus = document.getElementById('fontPlus');

        fontBtn.addEventListener('click', () => {
            fontPopup.classList.toggle('show');
            scrollPopup.classList.remove('show');
        });

        function updateFontSize(newSize) {
            fontSize = Math.max(14, Math.min(28, newSize));
            fontSizeDisplay.textContent = fontSize;
            fontSlider.value = fontSize;
            chapterContent.style.fontSize = fontSize + 'px';
            localStorage.setItem('novel-fontSize', fontSize);
        }

        fontSlider.addEventListener('input', (e) => {
            updateFontSize(parseInt(e.target.value));
        });

        fontMinus.addEventListener('click', () => {
            updateFontSize(fontSize - 1);
        });

        fontPlus.addEventListener('click', () => {
            updateFontSize(fontSize + 1);
        });

        // ============ 字體粗度控制 ============
        const weightBtns = document.querySelectorAll('.weight-btn');
        
        function updateFontWeight(weight) {
            fontWeight = weight;
            chapterContent.style.fontWeight = weight;
            localStorage.setItem('novel-fontWeight', weight);
            
            weightBtns.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.weight) === weight);
            });
        }

        weightBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                updateFontWeight(parseInt(btn.dataset.weight));
            });
        });

        // ============ 自動捲動控制 ============
        scrollBtn.addEventListener('click', () => {
            scrollPopup.classList.toggle('show');
            fontPopup.classList.remove('show');
        });

        // 選項按鈕
        document.querySelectorAll('.scroll-opt[data-interval]').forEach(btn => {
            btn.addEventListener('click', () => {
                scrollIntervalTime = parseFloat(btn.dataset.interval);
                document.querySelectorAll('.scroll-opt[data-interval]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                localStorage.setItem('novel-scrollInterval', scrollIntervalTime);
            });
        });

        document.querySelectorAll('.scroll-opt[data-speed]').forEach(btn => {
            btn.addEventListener('click', () => {
                scrollSpeed = parseFloat(btn.dataset.speed);
                document.querySelectorAll('.scroll-opt[data-speed]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                localStorage.setItem('novel-scrollSpeed', scrollSpeed);
            });
        });

        document.querySelectorAll('.scroll-opt[data-lines]').forEach(btn => {
            btn.addEventListener('click', () => {
                scrollLines = parseInt(btn.dataset.lines);
                document.querySelectorAll('.scroll-opt[data-lines]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                localStorage.setItem('novel-scrollLines', scrollLines);
            });
        });

        // 開始/停止自動捲動
        function smoothScrollBy(distance, duration) {
            const start = window.scrollY;
            const startTime = performance.now();
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // easeInOutCubic 緩動函數
                const easeProgress = progress < 0.5
                    ? 4 * progress * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;
                
                window.scrollTo(0, start + distance * easeProgress);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            
            requestAnimationFrame(animate);
        }

        function startAutoScroll() {
            if (autoScrollInterval) return;
            
            isAutoScrolling = true;
            
            function doScroll() {
                // 每次捲動時即時計算，這樣調整參數會立即生效
                const lineHeight = fontSize * 1.9;
                const scrollDistance = lineHeight * scrollLines;
                
                smoothScrollBy(scrollDistance, scrollSpeed * 1000);
                
                // 檢查是否到底部
                if ((window.innerHeight + window.scrollY) >= document.body.scrollHeight - 100) {
                    stopAutoScroll();
                }
            }
            
            // 使用 setTimeout 遞迴，這樣每次都能用最新的 scrollIntervalTime
            function scheduleNext() {
                autoScrollInterval = setTimeout(() => {
                    if (isAutoScrolling) {
                        doScroll();
                        scheduleNext();
                    }
                }, scrollIntervalTime * 1000);
            }
            
            // 立即執行第一次，然後開始排程
            doScroll();
            scheduleNext();
            
            scrollStartBtn.textContent = '⏹️ 停止自動捲動';
            scrollStartBtn.classList.add('active');
            scrollIndicator.classList.add('show');
            scrollPopup.classList.remove('show');
        }

        function stopAutoScroll() {
            if (autoScrollInterval) {
                clearTimeout(autoScrollInterval);
                autoScrollInterval = null;
            }
            isAutoScrolling = false;
            scrollStartBtn.textContent = '▶️ 開始自動捲動';
            scrollStartBtn.classList.remove('active');
            scrollIndicator.classList.remove('show');
        }

        scrollStartBtn.addEventListener('click', () => {
            if (autoScrollInterval) {
                stopAutoScroll();
            } else {
                startAutoScroll();
            }
        });

        scrollIndicator.addEventListener('click', stopAutoScroll);

        // ============ 載入設定 ============
        function loadSettings() {
            const savedTheme = localStorage.getItem('novel-theme');
            if (savedTheme === 'dark') {
                isDarkMode = true;
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️';
            }
            
            const savedFontSize = localStorage.getItem('novel-fontSize');
            if (savedFontSize) {
                fontSize = parseInt(savedFontSize);
                fontSlider.value = fontSize;
                fontSizeDisplay.textContent = fontSize;
            }
            
            // 載入字體粗度
            const savedFontWeight = localStorage.getItem('novel-fontWeight');
            if (savedFontWeight) {
                fontWeight = parseInt(savedFontWeight);
            }
            updateFontWeight(fontWeight);
            
            // 載入自動捲動設定
            const savedScrollInterval = localStorage.getItem('novel-scrollInterval');
            if (savedScrollInterval) scrollIntervalTime = parseFloat(savedScrollInterval);
            
            const savedScrollSpeed = localStorage.getItem('novel-scrollSpeed');
            if (savedScrollSpeed) scrollSpeed = parseFloat(savedScrollSpeed);
            
            const savedScrollLines = localStorage.getItem('novel-scrollLines');
            if (savedScrollLines) scrollLines = parseInt(savedScrollLines);
            
            // 更新按鈕狀態
            document.querySelectorAll('.scroll-opt[data-interval]').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.interval) === scrollIntervalTime);
            });
            document.querySelectorAll('.scroll-opt[data-speed]').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.speed) === scrollSpeed);
            });
            document.querySelectorAll('.scroll-opt[data-lines]').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.lines) === scrollLines);
            });
        }

        // ============ 章節目錄 ============
        function renderChapterList() {
            chapterList.innerHTML = chapters.map(ch => 
                `<li data-num="${ch.num}" class="${ch.num === currentChapterIndex ? 'active' : ''}">${ch.title}</li>`
            ).join('');

            chapterList.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', () => {
                    showChapter(parseInt(li.dataset.num));
                    toggleSidebar();
                });
            });
        }

        // ============ 顯示章節 ============
        async function showChapter(num) {
            // 檢查章節是否存在
            const chapterExists = chapters.some(ch => ch.num === num);
            if (!chapterExists) return;

            currentChapterIndex = num;
            
            const snap = await get(ref(db, `novel/chapters/${num}`));
            if (!snap.exists()) return;
            
            const chapter = snap.val();
            
            chapterTitle.textContent = chapter.title;
            
            const paragraphs = chapter.content
                .split(/\n\s*\n/)
                .filter(p => p.trim())
                .map(p => `<p>${p.trim()}</p>`)
                .join('');
            
            chapterContent.innerHTML = paragraphs || `<p>${chapter.content}</p>`;
            chapterContent.style.fontSize = fontSize + 'px';
            chapterContent.style.fontWeight = fontWeight;
            
            chapterView.style.display = 'block';

            // 顯示進度（第幾章 / 共幾章）
            const currentIndex = chapters.findIndex(ch => ch.num === num) + 1;
            chapterProgress.textContent = `${currentIndex} / ${totalChapters}`;

            chapterList.querySelectorAll('li').forEach(li => {
                li.classList.toggle('active', parseInt(li.dataset.num) === num);
            });

            window.scrollTo(0, 0);

            // 儲存進度
            await set(ref(db, 'novel/progress'), {
                chapter: num,
                updatedAt: Date.now()
            });
        }

        // ============ 上下章 ============
        function goToPrevChapter() {
            const currentIndex = chapters.findIndex(ch => ch.num === currentChapterIndex);
            if (currentIndex > 0) {
                showChapter(chapters[currentIndex - 1].num);
            }
        }

        function goToNextChapter() {
            const currentIndex = chapters.findIndex(ch => ch.num === currentChapterIndex);
            if (currentIndex < chapters.length - 1) {
                showChapter(chapters[currentIndex + 1].num);
            }
        }

        prevBtn.addEventListener('click', goToPrevChapter);
        nextBtn.addEventListener('click', goToNextChapter);

        // 鍵盤快捷鍵
        document.addEventListener('keydown', (e) => {
            if (chapters.length === 0) return;
            
            if (e.key === 'ArrowLeft') {
                goToPrevChapter();
            } else if (e.key === 'ArrowRight') {
                goToNextChapter();
            }
        });

        // ============ 滑動隱藏工具列 ============
        let lastScrollY = 0;
        let ticking = false;

        function handleScroll() {
            // 自動捲動時不處理工具列隱藏
            if (isAutoScrolling) {
                lastScrollY = window.scrollY;
                ticking = false;
                return;
            }
            
            const currentScrollY = window.scrollY;
            
            if (currentScrollY > lastScrollY && currentScrollY > 100) {
                // 往下滑 - 隱藏工具列
                header.classList.add('hidden');
                footerNav.classList.add('hidden');
            } else {
                // 往上滑 - 顯示工具列
                header.classList.remove('hidden');
                footerNav.classList.remove('hidden');
            }
            
            lastScrollY = currentScrollY;
            ticking = false;
        }

        window.addEventListener('scroll', () => {
            if (!ticking) {
                requestAnimationFrame(handleScroll);
                ticking = true;
            }
        });

        // 點擊畫面中間也可以顯示/隱藏工具列
        mainContent.addEventListener('click', (e) => {
            if (e.target === chapterContent || chapterContent.contains(e.target)) {
                header.classList.toggle('hidden');
                footerNav.classList.toggle('hidden');
            }
        });
    </script>
</body>
</html>
