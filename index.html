            updateFontWeight(fontWeight);
            
            // 載入自動捲動設定
            const savedScrollInterval = localStorage.getItem('novel-scrollInterval');
            if (savedScrollInterval) scrollIntervalTime = parseFloat(savedScrollInterval);
            
            const savedScrollSpeed = localStorage.getItem('novel-scrollSpeed');
            if (savedScrollSpeed) scrollSpeed = parseFloat(savedScrollSpeed);
            
            const savedScrollLines = localStorage.getItem('novel-scrollLines');
            if (savedScrollLines) scrollLines = parseInt(savedScrollLines);
            
            // 更新按鈕狀態
            document.querySelectorAll('.scroll-opt[data-interval]').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.interval) === scrollIntervalTime);
            });
            document.querySelectorAll('.scroll-opt[data-speed]').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.speed) === scrollSpeed);
            });
            document.querySelectorAll('.scroll-opt[data-lines]').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.lines) === scrollLines);
            });
        }

        // ============ 章節目錄 ============
        function renderChapterList() {
            chapterList.innerHTML = chapters.map(ch =>
                `<li data-num="${ch.num}" class="${ch.num === currentChapterIndex ? 'active' : ''}">${escapeHtml(ch.title)}</li>`
            ).join('');

            chapterList.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', () => {
                    showChapter(parseInt(li.dataset.num));
                    toggleSidebar();
                });
            });
        }

        // ============ 顯示章節 ============
        async function showChapter(num, opts = {}) {
            // 檢查章節是否存在
            const chapterExists = chapters.some(ch => ch.num === num);
            if (!chapterExists) return;

            currentChapterIndex = num;

            // 線上：讀網路。漫畫不快取（先不做離線）；小說順手存 localStorage 快取，離線退快取
            const snap = await tryGet(chapterRef(num));
            let chapter = (snap && snap.exists()) ? snap.val() : null;
            const isManga = chapter && Array.isArray(chapter.images);
            if (chapter && !isManga) cachePutChapter(num, chapter);
            else if (!chapter) chapter = cacheGetChapter(num);

            if (!chapter) {
                const meta = chapters.find(ch => ch.num === num);
                chapterTitle.textContent = meta ? meta.title : `第 ${num} 章`;
                chapterContent.classList.remove('manga-mode');
                chapterContent.innerHTML = '<p data-index="0">📡 離線中，這一章還沒預載（漫畫需連線）。回到有網路時再開。</p>';
                chapterView.style.display = 'block';
                chapterList.querySelectorAll('li').forEach(li => {
                    li.classList.toggle('active', parseInt(li.dataset.num) === num);
                });
                updateProgress();
                return;   // 不寫 progress、不動書籤
            }

            chapterTitle.textContent = chapter.title;

            if (Array.isArray(chapter.images)) {
                // 漫畫（條漫）：垂直排圖，每頁帶 data-index 以沿用進度/書籤/自動捲動
                chapterContent.classList.add('manga-mode');
                chapterContent.style.fontSize = '';
                chapterContent.style.fontWeight = '';
                chapterContent.innerHTML = chapter.images.map((url, i) =>
                    `<img class="manga-page" data-index="${i}" src="${escapeHtml(url)}" loading="lazy" alt="第${i + 1}頁">`
                ).join('');
            } else {
                // 小說：段落文字
                chapterContent.classList.remove('manga-mode');
                const paragraphs = chapter.content
                    .split(/\n\s*\n/)
                    .filter(p => p.trim())
                    .map((p, i) => `<p data-index="${i}">${escapeHtml(p.trim())}</p>`)
                    .join('');
                chapterContent.innerHTML = paragraphs || `<p data-index="0">${escapeHtml(chapter.content)}</p>`;
                chapterContent.style.fontSize = fontSize + 'px';
                chapterContent.style.fontWeight = fontWeight;
            }

            chapterView.style.display = 'block';

            // 顯示進度（章節號 + 本章閱讀百分比）
            updateProgress();

            chapterList.querySelectorAll('li').forEach(li => {
                li.classList.toggle('active', parseInt(li.dataset.num) === num);
            });

            window.scrollTo(0, 0);
            
            // 載入書籤（以進度 resume 時不自動跳書籤，避免捲動互搶）
            await loadBookmark(!opts.skipBookmarkJump);

            // 手動翻章 → 記「本章開頭」；resume 開書不寫（其他裝置可能有較新位置）
            // fire-and-forget：離線時 set() 會排隊等回線，await 會卡住
            if (!opts.isResume) {
                lastSavedPos = { chapter: num, paragraph: 0 };
                writeProgress({ chapter: num, paragraph: 0, updatedAt: Date.now() });
            }
        }
        
        // 更新閱讀進度百分比
        function updateProgress() {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const percent = docHeight > 0 ? Math.round((scrollTop / docHeight) * 100) : 0;
            chapterProgress.textContent = `${currentChapterIndex} 章 (${percent}%)`;
        }

        // ============ 自動記錄閱讀位置（捲動停止 3 秒 debounce + 離開頁面強制存） ============
        let autoSaveInterval = null;
        let saveDebounceTimer = null;
        let lastSavedPos = null;   // 上次寫入的 {chapter, paragraph}；相同就不重寫（省流量、防閒置覆寫）

        function getCurrentParagraphIndex() {
            // 找出目前畫面中央的段落
            const paragraphs = chapterContent.querySelectorAll('[data-index]');
            const viewportCenter = window.innerHeight / 2;
            
            for (const p of paragraphs) {
                const rect = p.getBoundingClientRect();
                if (rect.top <= viewportCenter && rect.bottom >= viewportCenter) {
                    return parseInt(p.dataset.index);
                }
            }
            
            // 如果沒找到，找最接近的
            let closestIndex = 0;
            let closestDistance = Infinity;
            paragraphs.forEach(p => {
                const rect = p.getBoundingClientRect();
                const distance = Math.abs(rect.top - viewportCenter);
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestIndex = parseInt(p.dataset.index);
                }
            });
            
            return closestIndex;
        }
        
        async function saveReadingPosition(force = false) {
            if (!currentUser || chapters.length === 0) return;
            // 背景分頁不寫（閒置裝置不能蓋掉正在閱讀那台的進度）；離開頁面那次用 force
            if (!force && document.visibilityState === 'hidden') return;

            const paragraphIndex = getCurrentParagraphIndex();
            // 位置沒變就不寫 —— force 也一樣。force 的用途是「把還沒 debounce 出去的位置補存」，
            // 不是「離頁就無條件蓋一筆」：背景擱一整天沒動過的分頁被關掉時，
            // 不該拿舊位置配現在的 timestamp 蓋掉另一台的較新進度。
            if (lastSavedPos &&
                lastSavedPos.chapter === currentChapterIndex &&
                lastSavedPos.paragraph === paragraphIndex) return;

            // 本機鏡像先落地（離線也不丟），遠端走 writeProgress（只在比伺服器新時才蓋）
            writeProgress({ chapter: currentChapterIndex, paragraph: paragraphIndex, updatedAt: Date.now() });
            lastSavedPos = { chapter: currentChapterIndex, paragraph: paragraphIndex };
            console.log(`自動存檔: 第${currentChapterIndex}章 第${paragraphIndex}段`);
        }

        function startAutoSave() {
            if (autoSaveInterval) return;
            // 保險網：每 3 分鐘檢查一次（主要存檔靠捲動 debounce；有 hidden/沒變 guard，閒置分頁不會寫）
            autoSaveInterval = setInterval(() => saveReadingPosition(), 3 * 60 * 1000);
        }

        function stopAutoSave() {
            if (autoSaveInterval) {
                clearInterval(autoSaveInterval);
                autoSaveInterval = null;
            }
            clearTimeout(saveDebounceTimer);
        }

        // ============ 回到前景時重拉遠端進度（跨裝置提示，不強制跳） ============
        // 進度沒有 onValue 監聽（即時跟進會打斷正在讀的地方），所以靠回前景時拉一次。
        let syncToastTimer = null;

        function hideSyncToast() {
            syncToast.classList.remove('show');
            clearTimeout(syncToastTimer);
        }

        async function checkRemoteProgress() {
            if (!currentUser || chapters.length === 0) return;

            const snap = await tryGet(progressRef());
            if (!snap || !snap.exists()) return;
            const pg = snap.val();
            if (!pg || !pg.chapter) return;

            // 比本機鏡像：自己寫出去的那筆會同步更新鏡像，所以只有「別台寫的」才會比較新
            const localTs = (lsGetJson(progressCacheKey()) || {}).updatedAt || 0;
            if ((pg.updatedAt || 0) <= localTs) return;

            // 位置實質相同就不用問（同章且段落差 1 以內，多半是對方剛好讀到附近）
            if (pg.chapter === currentChapterIndex &&
                Math.abs((pg.paragraph || 0) - getCurrentParagraphIndex()) <= 1) return;

            const chap = chapters.find(c => c.num === pg.chapter);
            if (!chap) return;   // 這本書沒有這章（資料不一致）就別提示

            syncToastText.textContent = `其他裝置讀到第 ${pg.chapter} 章`;
            syncToast.classList.add('show');
            clearTimeout(syncToastTimer);
            syncToastTimer = setTimeout(hideSyncToast, 15000);

            syncToastGo.onclick = async () => {
                hideSyncToast();
                if (pg.chapter !== currentChapterIndex) {
                    // skipBookmarkJump：目標是進度位置，別讓書籤搶捲動
                    await showChapter(pg.chapter, { skipBookmarkJump: true });
                }
                setTimeout(() => {
                    const el = chapterContent.querySelector(`[data-index="${pg.paragraph || 0}"]`);
                    if (el) el.scrollIntoView({ behavior: 'auto', block: 'center' });
                    // showChapter 剛把 progress 寫成「本章第 0 段」，補存實際落點；
                    // 否則使用者跳完馬上關掉（來不及等 3 秒 debounce）會退回章首
                    setTimeout(() => saveReadingPosition(), 250);
                }, 150);
            };
        }

        syncToastClose.addEventListener('click', hideSyncToast);

        // 頁面關閉/隱藏時強制存一次（iOS 不觸發 beforeunload，靠 visibilitychange/pagehide）
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                saveReadingPosition(true);
            } else {
                checkRemoteProgress();
            }
        });

        window.addEventListener('pagehide', () => {
            saveReadingPosition(true);
        });

        window.addEventListener('beforeunload', () => {
            saveReadingPosition(true);
        });

        // ============ 上下章 ============
        function goToPrevChapter() {
            const currentIndex = chapters.findIndex(ch => ch.num === currentChapterIndex);
            if (currentIndex > 0) {
                showChapter(chapters[currentIndex - 1].num);
            }
        }

        async function goToNextChapter() {
            const currentIndex = chapters.findIndex(ch => ch.num === currentChapterIndex);
            if (currentIndex < chapters.length - 1) {
                await showChapter(chapters[currentIndex + 1].num);
            }
        }

        prevBtn.addEventListener('click', goToPrevChapter);
        nextBtn.addEventListener('click', goToNextChapter);

        // 跳到底部
        const scrollToBottomBtn = document.getElementById('scrollToBottomBtn');
        scrollToBottomBtn.addEventListener('click', () => {
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        });

        // 鍵盤快捷鍵
        document.addEventListener('keydown', (e) => {
            if (chapters.length === 0) return;
            
            if (e.key === 'ArrowLeft') {
                goToPrevChapter();
            } else if (e.key === 'ArrowRight') {
                goToNextChapter();
            }
        });

        // ============ 滑動隱藏工具列（只在手機版） ============
        let lastScrollY = 0;
        let ticking = false;
        const hideThreshold = 50;  // 往下滑 50px 就隱藏（敏感）
        const showThreshold = 120; // 往上滑 120px 才顯示（不敏感）

        function handleScroll() {
            // 更新閱讀進度
            updateProgress();
            
            // 電腦版不自動隱藏工具列
            if (window.innerWidth > 1024) {
                ticking = false;
                return;
            }
            
            // 自動捲動時不處理工具列隱藏
            if (isAutoScrolling) {
                lastScrollY = window.scrollY;
                ticking = false;
                return;
            }
            
            const currentScrollY = window.scrollY;
            const scrollDiff = currentScrollY - lastScrollY;
            
            if (scrollDiff > hideThreshold && currentScrollY > 100) {
                // 往下滑超過門檻 - 隱藏工具列
                header.classList.add('hidden');
                footerNav.classList.add('hidden');
                lastScrollY = currentScrollY;
            } else if (scrollDiff < -showThreshold) {
                // 往上滑超過門檻 - 顯示工具列
                header.classList.remove('hidden');
                footerNav.classList.remove('hidden');
                lastScrollY = currentScrollY;
            }
            
            ticking = false;
        }

        window.addEventListener('scroll', () => {
            if (!ticking) {
                requestAnimationFrame(handleScroll);
                ticking = true;
            }
            // 捲動停止 3 秒後存一次進度（跨裝置同步的主要寫入點）
            clearTimeout(saveDebounceTimer);
            saveDebounceTimer = setTimeout(() => saveReadingPosition(), 3000);
        });

        // 點擊畫面中間也可以顯示/隱藏工具列（只在手機版）
        mainContent.addEventListener('click', (e) => {
            if (window.innerWidth > 1024) return;
            if (e.target === chapterContent || chapterContent.contains(e.target)) {
                header.classList.toggle('hidden');
                footerNav.classList.toggle('hidden');
            }
        });
        
        // ============ 書籤功能 ============
        // 取得畫面中央的段落（漫畫則為畫面中央的圖片頁）
        function getCenterParagraph() {
            const paragraphs = chapterContent.querySelectorAll('[data-index]');
            const viewportCenter = window.scrollY + window.innerHeight / 2;
            
            let closestP = null;
            let closestDistance = Infinity;
            
            paragraphs.forEach(p => {
                const rect = p.getBoundingClientRect();
                const pCenter = window.scrollY + rect.top + rect.height / 2;
                const distance = Math.abs(pCenter - viewportCenter);
                
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestP = p;
                }
            });
            
            return closestP;
        }
        
        // 顯示書籤直線
        function showBookmarkLine(paragraphIndex) {
            // 移除舊的書籤線
            const oldLine = chapterContent.querySelector('.bookmark-line');
            if (oldLine) oldLine.remove();
            
            const p = chapterContent.querySelector(`[data-index="${paragraphIndex}"]`);
            if (!p) return;
            
            const line = document.createElement('div');
            line.className = 'bookmark-line';
            line.style.top = p.offsetTop + 'px';
            line.style.height = p.offsetHeight + 'px';
            chapterContent.appendChild(line);
            
            bookmarkBtn.classList.add('active');
        }
        
        // 清除書籤直線
        function clearBookmarkLine() {
            const line = chapterContent.querySelector('.bookmark-line');
            if (line) line.remove();
            bookmarkBtn.classList.remove('active');
        }
        
        // 「跳到書籤」按鈕只在有書籤時出現（書籤在別章也算，按了會先翻過去）
        function updateGotoBookmarkBtn() {
            gotoBookmarkBtn.style.display = currentBookmark ? '' : 'none';
        }

        // 跳到書籤位置：同章直接捲，別章先翻章（showChapter 預設 autoJump 會自己捲到書籤）
        async function gotoBookmark() {
            const bm = currentBookmark;
            if (!bm) return;
            if (bm.chapter !== currentChapterIndex) {
                await showChapter(bm.chapter);
                return;
            }
            const p = chapterContent.querySelector(`[data-index="${bm.paragraph}"]`);
            if (p) p.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        gotoBookmarkBtn.addEventListener('click', gotoBookmark);

        // 載入書籤（在 showChapter 內呼叫：畫線 + 若書籤在本章則自動跳過去）
        async function loadBookmark(autoJump = true) {
            clearBookmarkLine();
            currentBookmark = null;

            const snap = await tryGet(bookmarkRef());
            let bookmark = (snap && snap.exists() && snap.val()) ? snap.val() : null;
            if (snap === null) bookmark = lsGetJson(bookmarkCacheKey());   // 離線退鏡像
            else if (bookmark) lsSetJson(bookmarkCacheKey(), bookmark);
            else localStorage.removeItem(bookmarkCacheKey());
            if (bookmark) {
                currentBookmark = bookmark;
                if (bookmark.chapter === currentChapterIndex) {
                    showBookmarkLine(bookmark.paragraph);

                    // 自動跳到書籤位置（以進度 resume 時關閉，避免搶捲動）
                    if (autoJump) {
                        const p = chapterContent.querySelector(`[data-index="${bookmark.paragraph}"]`);
                        if (p) {
                            setTimeout(() => {
                                p.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }, 300);
                        }
                    }
                }
            }
            updateGotoBookmarkBtn();
        }

        // 即時監聽書籤：其他裝置改書籤時，本機標記同步更新（不強制捲動，避免打斷閱讀）
        function attachBookmarkListener() {
            bookmarkListenerUnsub = onValue(bookmarkRef(), (snap) => {
                const bm = (snap.exists() && snap.val()) ? snap.val() : null;
                currentBookmark = bm;
                if (bm) lsSetJson(bookmarkCacheKey(), bm);
                else localStorage.removeItem(bookmarkCacheKey());
                if (bm && bm.chapter === currentChapterIndex) {
                    showBookmarkLine(bm.paragraph);
                } else {
                    clearBookmarkLine();
                }
                updateGotoBookmarkBtn();
            });
        }

        // 儲存書籤
        async function saveBookmark(paragraphIndex) {
            currentBookmark = {
                chapter: currentChapterIndex,
                paragraph: paragraphIndex,
                updatedAt: Date.now()
            };

            lsSetJson(bookmarkCacheKey(), currentBookmark);
            set(bookmarkRef(), currentBookmark).catch(() => {});   // 離線排隊，回線補送
            showBookmarkLine(paragraphIndex);
            updateGotoBookmarkBtn();
        }

        // 刪除書籤
        async function removeBookmark() {
            currentBookmark = null;
            localStorage.removeItem(bookmarkCacheKey());
            set(bookmarkRef(), null).catch(() => {});
            clearBookmarkLine();
            updateGotoBookmarkBtn();
        }
        
        // 書籤按鈕點擊
        bookmarkBtn.addEventListener('click', async () => {
            if (currentBookmark && currentBookmark.chapter === currentChapterIndex) {
                // 已有書籤，刪除
                await removeBookmark();
            } else {
                // 新增書籤到畫面中央段落
                const centerP = getCenterParagraph();
                if (centerP) {
                    const index = parseInt(centerP.dataset.index);
                    await saveBookmark(index);
                }
            }
        });

        // ============ TTS 唸故事功能 ============
        
        // 載入語音列表
        function loadTtsVoices() {
            const voices = speechSynthesis.getVoices();
            
            // 篩選中文語音
            ttsVoices = voices.filter(v => 
                v.lang.includes('zh') || 
                v.lang.includes('cmn') ||
                v.name.toLowerCase().includes('chinese') ||
                v.name.includes('中文')
            );
            
            if (ttsVoices.length === 0) {
                voiceSelect.innerHTML = '<option value="">無可用中文語音</option>';
                return;
            }
            
            // 更新下拉選單
            voiceSelect.innerHTML = ttsVoices.map((v, i) => {
                const region = v.lang.includes('TW') ? '(台灣)' 
                    : v.lang.includes('HK') ? '(香港)' 
                    : v.lang.includes('CN') ? '(中國)' 
                    : '';
                return `<option value="${i}">${v.name} ${region}</option>`;
            }).join('');
            
            // 載入儲存的語音偏好
            const savedVoiceIndex = localStorage.getItem('novel-ttsVoice');
            if (savedVoiceIndex && parseInt(savedVoiceIndex) < ttsVoices.length) {
                voiceSelect.value = savedVoiceIndex;
                ttsSelectedVoice = ttsVoices[parseInt(savedVoiceIndex)];
            } else {
                ttsSelectedVoice = ttsVoices[0];
            }
        }
        
        // 語音載入（有些瀏覽器需要等待）
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadTtsVoices;
        }
        loadTtsVoices();
        setTimeout(loadTtsVoices, 100);
        setTimeout(loadTtsVoices, 500);
        
        // 語音選擇變更
        voiceSelect.addEventListener('change', () => {
            const index = parseInt(voiceSelect.value);
            if (!isNaN(index) && ttsVoices[index]) {
                ttsSelectedVoice = ttsVoices[index];
                localStorage.setItem('novel-ttsVoice', index);
            }
        });
        
        // 語速選擇
        document.querySelectorAll('.tts-rate-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                ttsRate = parseFloat(btn.dataset.rate);
                ttsRateValue.textContent = ttsRate + 'x';
                document.querySelectorAll('.tts-rate-opt').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                localStorage.setItem('novel-ttsRate', ttsRate);
            });
        });
        
        // 載入 TTS 設定
        function loadTtsSettings() {
            const savedRate = localStorage.getItem('novel-ttsRate');
            if (savedRate) {
                ttsRate = parseFloat(savedRate);
                ttsRateValue.textContent = ttsRate + 'x';
            }
            
            // 更新按鈕狀態
            document.querySelectorAll('.tts-rate-opt').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.rate) === ttsRate);
            });
        }
        loadTtsSettings();
        
        // 清除 highlight
        function clearTtsHighlight() {
            chapterContent.querySelectorAll('p.tts-speaking').forEach(p => {
                p.classList.remove('tts-speaking');
            });
        }
        
        // 唸一個段落
        function speakParagraph(index) {
            const paragraphs = chapterContent.querySelectorAll('p');
            if (index >= paragraphs.length) {
                // 唸完了
                stopTts();
                return;
            }
            
            const p = paragraphs[index];
            const text = p.textContent.trim();
            
            if (!text) {
                // 空段落，跳到下一個
                speakParagraph(index + 1);
                return;
            }
            
            // Highlight 目前段落
            clearTtsHighlight();
            p.classList.add('tts-speaking');
            
            // 捲動到該段落
            p.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // 建立語音
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.voice = ttsSelectedVoice;
            utterance.lang = 'zh-TW';
            utterance.rate = ttsRate;
            
            utterance.onend = () => {
                if (ttsSpeaking) {
                    ttsCurrentParagraphIndex = index + 1;
                    speakParagraph(ttsCurrentParagraphIndex);
                }
            };
            
            utterance.onerror = (e) => {
                console.error('TTS error:', e);
                if (ttsSpeaking) {
                    ttsCurrentParagraphIndex = index + 1;
                    speakParagraph(ttsCurrentParagraphIndex);
                }
            };
            
            speechSynthesis.speak(utterance);
        }
        
        // 開始唸故事
        function startTts() {
            if (ttsVoices.length === 0) {
                alert('沒有可用的中文語音');
                return;
            }
            
            ttsSpeaking = true;
            
            // 從畫面中央的段落開始
            const centerP = getCenterParagraph();
            if (centerP) {
                ttsCurrentParagraphIndex = parseInt(centerP.dataset.index);
            } else {
                ttsCurrentParagraphIndex = 0;
            }
            
            speakParagraph(ttsCurrentParagraphIndex);
            
            // UI 更新
            ttsStartBtn.textContent = '⏹️ 停止唸故事';
            ttsStartBtn.classList.add('active');
            ttsIndicator.classList.add('show');
            ttsPopup.classList.remove('show');
            
            // 快捷按鈕變暗
            quickTtsBtn.style.opacity = '0.4';
            quickTtsBtn.style.pointerEvents = 'none';
            
            // 只在手機版收起工具列
            if (window.innerWidth <= 1024) {
                header.classList.add('hidden');
                footerNav.classList.add('hidden');
            }
        }
        
        // 停止唸故事
        function stopTts() {
            ttsSpeaking = false;
            speechSynthesis.cancel();
            clearTtsHighlight();
            
            // UI 更新
            ttsStartBtn.textContent = '🔊 開始唸故事';
            ttsStartBtn.classList.remove('active');
            ttsIndicator.classList.remove('show');
            
            // 快捷按鈕恢復
            quickTtsBtn.style.opacity = '1';
            quickTtsBtn.style.pointerEvents = 'auto';
        }
        
        // 設定按鈕
        ttsBtn.addEventListener('click', () => {
            ttsPopup.classList.toggle('show');
            fontPopup.classList.remove('show');
            scrollPopup.classList.remove('show');
        });
        
        // 開始/停止按鈕
        ttsStartBtn.addEventListener('click', () => {
            if (ttsSpeaking) {
                stopTts();
            } else {
                startTts();
            }
        });
        
        // 快捷按鈕
        quickTtsBtn.addEventListener('click', () => {
            startTts();
        });
        
        // 指示器點擊停止
        ttsIndicator.addEventListener('click', stopTts);
        
        // 切換章節時停止 TTS
        const originalShowChapter = showChapter;
        showChapter = async function(num, opts) {
            if (ttsSpeaking) {
                stopTts();
            }
            return originalShowChapter(num, opts);
        };

        // ============ 背景音樂功能 ============
        const musicBtn = document.getElementById('musicBtn');
        const musicPopup = document.getElementById('musicPopup');
        const musicPlayBtn = document.getElementById('musicPlayBtn');
        const musicVolumeSlider = document.getElementById('musicVolumeSlider');
        const musicVolumeValue = document.getElementById('musicVolumeValue');
        const musicIndicator = document.getElementById('musicIndicator');
        const bgMusic = document.getElementById('bgMusic');
        const menuMusicSettings = document.getElementById('menuMusicSettings');
        
        let currentMusicPath = null;
        let isMusicPlaying = false;
        let playMode = 'single'; // 'single' 單曲循環, 'playlist' 輪播
        const musicList = ['Traveler.mp3', 'Old.mp3', 'Canon.mp3', 'River.mp3'];

        // 播放模式切換
        document.querySelectorAll('.play-mode-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.play-mode-opt').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                playMode = btn.dataset.mode;
                localStorage.setItem('novel-playMode', playMode);
                
                // 更新 loop 屬性
                bgMusic.loop = (playMode === 'single');
            });
        });

        // 輪播：歌曲結束時播下一首
        bgMusic.addEventListener('ended', async () => {
            if (playMode === 'playlist' && isMusicPlaying) {
                // 找下一首
                const currentIndex = musicList.indexOf(currentMusicPath);
                const nextIndex = (currentIndex + 1) % musicList.length;
                currentMusicPath = musicList[nextIndex];
                
                // 更新 UI
                document.querySelectorAll('.music-item').forEach(i => {
                    i.classList.remove('active', 'playing');
                    if (i.dataset.path === currentMusicPath) {
                        i.classList.add('active', 'playing');
                    }
                });
                
                localStorage.setItem('novel-musicPath', currentMusicPath);
                
                // 播放下一首
                try {
                    const musicRef = storageRef(storage, currentMusicPath);
                    const url = await getDownloadURL(musicRef);
                    bgMusic.src = url;
                    bgMusic.play();
                } catch (err) {
                    console.error('播放下一首失敗:', err);
                    stopMusic();
                }
            }
        });

        // 音量控制
        function updateVolume() {
            const volume = musicVolumeSlider.value;
            musicVolumeValue.textContent = volume + '%';
            bgMusic.volume = volume / 100;
            localStorage.setItem('novel-musicVolume', volume);
        }
        
        musicVolumeSlider.addEventListener('input', updateVolume);
        musicVolumeSlider.addEventListener('change', updateVolume);
        musicVolumeSlider.addEventListener('touchmove', (e) => {
            e.stopPropagation();
            updateVolume();
        });
        musicVolumeSlider.addEventListener('touchend', updateVolume);

        // 音量按鈕
        const volumeDown = document.getElementById('volumeDown');
        const volumeUp = document.getElementById('volumeUp');

        volumeDown.addEventListener('click', () => {
            let vol = parseInt(musicVolumeSlider.value) - 10;
            if (vol < 0) vol = 0;
            musicVolumeSlider.value = vol;
            updateVolume();
        });

        volumeUp.addEventListener('click', () => {
            let vol = parseInt(musicVolumeSlider.value) + 10;
            if (vol > 100) vol = 100;
            musicVolumeSlider.value = vol;
            updateVolume();
        });

        // 播放/停止
        async function playMusic() {
            if (!currentMusicPath) {
                alert('請先選擇一首音樂');
                return;
            }
            
            if (!currentUser) {
                alert('請先登入才能播放音樂');
                return;
            }
            
            try {
                // 從 Firebase Storage 取得下載 URL
                const musicRef = storageRef(storage, currentMusicPath);
                const url = await getDownloadURL(musicRef);
                
                // 如果換歌，先停止目前的
                if (bgMusic.src && bgMusic.src !== url) {
                    bgMusic.pause();
                }
                
                bgMusic.src = url;
                bgMusic.volume = musicVolumeSlider.value / 100;
                bgMusic.loop = (playMode === 'single'); // 單曲循環時啟用 loop
                
                // 更新 UI 狀態
                isMusicPlaying = true;
                musicPlayBtn.textContent = '⏹️ 停止';
                musicPlayBtn.classList.add('active');
                musicIndicator.classList.add('show');
                
                // 更新音樂項目狀態
                document.querySelectorAll('.music-item').forEach(i => {
                    i.classList.remove('playing');
                    if (i.dataset.path === currentMusicPath) {
                        i.classList.add('playing');
                    }
                });
            
                updateIndicatorPositions();
                
                bgMusic.play().catch(err => {
                    console.error('播放失敗:', err);
                    stopMusic();
                });
                
                musicPopup.classList.remove('show');
            } catch (err) {
                console.error('取得音樂失敗:', err);
                if (err.code === 'storage/unauthorized') {
                    alert('沒有權限播放音樂');
                } else if (err.code === 'storage/object-not-found') {
                    alert('找不到音樂檔案，請確認 Firebase Storage 中有上傳 music/ 資料夾');
                } else {
                    alert('播放失敗: ' + err.message);
                }
            }
        }

        function stopMusic() {
            bgMusic.pause();
            bgMusic.currentTime = 0;
            
            isMusicPlaying = false;
            musicPlayBtn.textContent = '▶️ 播放';
            musicPlayBtn.classList.remove('active');
            musicIndicator.classList.remove('show');
            
            document.querySelectorAll('.music-item').forEach(i => {
                i.classList.remove('playing');
            });
            
            updateIndicatorPositions();
        }

        // 動態調整指示器位置
        function updateIndicatorPositions() {
            const scrollShowing = scrollIndicator.classList.contains('show');
            const musicShowing = musicIndicator.classList.contains('show');
            const isMobile = window.innerWidth <= 1024;
            
            const baseTop = isMobile ? 65 : 70;
            const gap = isMobile ? 38 : 45;
            
            // 捲動指示器永遠在最上面
            scrollIndicator.style.top = baseTop + 'px';
            
            // 音樂指示器：有捲動時往下移
            if (scrollShowing && musicShowing) {
                musicIndicator.style.top = (baseTop + gap) + 'px';
            } else {
                musicIndicator.style.top = baseTop + 'px';
            }
        }

        // 點擊歌曲時，如果正在播放就自動切換
        document.querySelectorAll('.music-item').forEach(item => {
            item.addEventListener('click', () => {
                const wasPlaying = isMusicPlaying;
                const newPath = item.dataset.path;
                
                // 更新選擇狀態
                document.querySelectorAll('.music-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentMusicPath = newPath;
                localStorage.setItem('novel-musicPath', currentMusicPath);
                
                // 如果正在播放，自動切換到新歌
                if (wasPlaying) {
                    playMusic();
                }
            });
        });

        musicPlayBtn.addEventListener('click', () => {
            if (isMusicPlaying) {
                stopMusic();
            } else {
                playMusic();
            }
        });

        // 音樂按鈕點擊（電腦版）
        musicBtn.addEventListener('click', () => {
            musicPopup.classList.toggle('show');
            fontPopup.classList.remove('show');
            scrollPopup.classList.remove('show');
            ttsPopup.classList.remove('show');
        });

        // 音樂指示器點擊停止
        musicIndicator.addEventListener('click', stopMusic);

        // 手機版選單
        menuMusicSettings.addEventListener('click', () => {
            userDropdown.classList.remove('show');
            musicPopup.classList.toggle('show');
        });

        // 載入音樂設定
        function loadMusicSettings() {
            const savedMusicPath = localStorage.getItem('novel-musicPath');
            if (savedMusicPath) {
                currentMusicPath = savedMusicPath;
                document.querySelectorAll('.music-item').forEach(i => {
                    i.classList.toggle('active', i.dataset.path === savedMusicPath);
                });
            }
            
            const savedVolume = localStorage.getItem('novel-musicVolume');
            if (savedVolume) {
                musicVolumeSlider.value = savedVolume;
                musicVolumeValue.textContent = savedVolume + '%';
            }
            
            // 載入播放模式
            const savedPlayMode = localStorage.getItem('novel-playMode');
            if (savedPlayMode) {
                playMode = savedPlayMode;
                document.querySelectorAll('.play-mode-opt').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === savedPlayMode);
                });
            }
        }
        loadMusicSettings();

        // ============ Service worker（離線外殼：飛機上 app 才打得開） ============
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
    </script>
</body>
</html>
