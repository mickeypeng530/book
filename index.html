<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小說閱讀器</title>

    <!-- App 圖示 / 加到主畫面 -->
    <link rel="icon" type="image/png" href="favicon-48.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141c3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="小說閱讀器">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 淺色模式 */
        :root {
            --bg-color: #f5f5dc;
            --text-color: #333;
            --header-bg: #fff;
            --border-color: #ddd;
            --button-bg: #4a4a4a;
            --button-text: #fff;
            --chapter-bg: #fff;
            --shadow: rgba(0,0,0,0.1);
        }

        /* 深色模式 */
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #c0c0c0;
            --header-bg: #2d2d2d;
            --border-color: #444;
            --button-bg: #555;
            --button-text: #fff;
            --chapter-bg: #252525;
            --shadow: rgba(0,0,0,0.3);
        }

        body {
            font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            transition: all 0.3s ease;
        }

        @media (min-width: 1024px) {
            body {
                line-height: 1.5;
            }
        }

        /* 頂部導航列 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 100;
            box-shadow: 0 2px 10px var(--shadow);
            transition: transform 0.3s ease;
        }

        .header.hidden {
            transform: translateY(-100%);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: normal;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* 按鈕樣式 */
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: var(--button-bg);
            color: var(--button-text);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            padding: 0;
            font-size: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 手機版 icon 較小 */
        @media (max-width: 1024px) {
            .btn-icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }

        /* 登入區 */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .login-screen h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .login-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 15px 30px;
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--shadow);
        }

        .login-btn img {
            width: 24px;
            height: 24px;
        }

        /* 側邊章節目錄 */
        .sidebar {
            position: fixed;
            top: 60px;
            left: -320px;
            width: 320px;
            height: calc(100vh - 60px);
            background: var(--header-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            transition: left 0.3s ease;
            z-index: 99;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            position: sticky;
            top: 0;
            background: var(--header-bg);
        }

        .chapter-list {
            list-style: none;
        }

        .chapter-list li {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }

        .chapter-list li:hover {
            background: var(--bg-color);
        }

        .chapter-list li.active {
            background: var(--button-bg);
            color: var(--button-text);
        }

        /* 遮罩 */
        .overlay {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 98;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* 主要內容區 */
        .main-content {
            max-width: 99%;
            margin: 0 auto;
            padding: 80px 8px 120px;
            display: none;
        }

        /* 響應式內容寬度 */
        @media (min-width: 1024px) {
            .main-content {
                max-width: 90%;
                padding: 80px 20px 120px;
            }
        }

        @media (min-width: 1024px) {
            .main-content {
                max-width: 70%;
            }
        }

        @media (min-width: 1440px) {
            .main-content {
                max-width: 75%;
            }
        }

        .main-content.show {
            display: block;
        }

        .chapter-title {
            font-size: 1.4rem;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            text-align: center;
        }

        .chapter-content {
            font-size: 18px;
            text-align: justify;
        }

        .chapter-content p {
            margin-bottom: 1.5em;
            text-indent: 2em;
        }

        /* 漫畫（條漫）模式 */
        .chapter-content.manga-mode {
            max-width: 100%;
            text-align: center;
            font-size: 0;            /* 消除 img 間的行內空隙 */
        }
        .chapter-content.manga-mode .manga-page {
            display: block;
            width: 100%;
            max-width: 760px;        /* 桌機置中不過寬,手機滿版 */
            margin: 0 auto;
            background: #111;          /* 圖未載入時的底色 */
            min-height: 40px;
        }

        /* 底部導航 */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: none;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .footer-nav.show {
            display: flex;
        }

        .footer-nav.hidden {
            transform: translateY(100%);
        }

        /* 手機版底部導航：只顯示圖示 */
        @media (max-width: 768px) {
            .footer-nav {
                gap: 8px;
            }
            .footer-nav .btn {
                padding: 8px 10px;
            }
            .footer-nav .btn-text {
                display: none;
            }
            .footer-nav .btn svg {
                margin: 0;
            }
            .chapter-progress {
                min-width: auto;
                font-size: 12px;
            }
        }

        .chapter-progress {
            font-size: 14px;
            min-width: 100px;
            text-align: center;
        }

        /* 書籤按鈕 */
        .bookmark-btn {
            font-size: 16px;
            padding: 8px 10px;
            opacity: 0.5;
            transition: all 0.2s;
        }

        .bookmark-btn.active {
            opacity: 1;
            background: var(--button-bg);
            color: var(--button-text);
        }

        /* 跳到書籤按鈕（只在有書籤時顯示，見 updateGotoBookmarkBtn） */
        .goto-bookmark-btn {
            padding: 8px 10px;
            opacity: 0.7;
        }

        .goto-bookmark-btn:hover {
            opacity: 1;
        }

        /* 跨裝置進度提示條 */
        .sync-toast {
            position: fixed;
            left: 50%;
            bottom: 76px;
            transform: translateX(-50%) translateY(20px);
            width: max-content;
            max-width: min(92vw, 440px);
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            padding: 10px 12px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 300;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .sync-toast.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .sync-toast-text {
            flex: 1;
            line-height: 1.4;
            min-width: 0;
        }

        .sync-toast .btn {
            padding: 6px 12px;
            font-size: 13px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* 書籤直線標記 */
        .bookmark-line {
            position: absolute;
            left: -8px;
            width: 3px;
            background: #3B8BD4;
            opacity: 0.7;
            border-radius: 2px;
            pointer-events: none;
        }

        /* 章節內容容器需要 relative */
        .chapter-content {
            position: relative;
        }

        /* 載入畫面 */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            color: #888;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top-color: var(--button-bg);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 字體控制彈窗 */
        .font-popup, .scroll-popup, .tts-popup, .music-popup {
            position: fixed;
            top: 70px;
            right: 10px;
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 20px var(--shadow);
            display: none;
            z-index: 101;
            min-width: 200px;
        }

        .font-popup.show, .scroll-popup.show, .tts-popup.show, .music-popup.show {
            display: block;
        }

        .popup-section {
            margin-bottom: 15px;
        }

        .popup-section:last-child {
            margin-bottom: 0;
        }

        .popup-section label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #888;
            text-align: center;
        }

        .font-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .font-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            background: var(--button-bg);
            color: var(--button-text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-btn:hover {
            opacity: 0.8;
        }

        .font-size-value {
            min-width: 50px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .font-slider {
            width: 100%;
        }

        /* 字體粗度控制 */
        .weight-controls {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .weight-btn {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: transparent;
            color: var(--text-color);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .weight-btn:hover {
            background: var(--bg-color);
        }

        .weight-btn.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: var(--button-bg);
        }

        /* 自動捲動控制 */
        .scroll-options {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .scroll-opt {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: transparent;
            color: var(--text-color);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scroll-opt:hover {
            background: var(--bg-color);
        }

        .scroll-opt.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: var(--button-bg);
        }

        .scroll-start-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #4ade80;
            color: #000;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scroll-start-btn:hover {
            background: #22c55e;
        }

        .scroll-start-btn.active {
            background: #f87171;
        }

        /* 自動捲動指示器 */
        .scroll-indicator {
            position: fixed;
            top: 70px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(74, 222, 128, 0.35);
            color: #000;
            border-radius: 50%;
            font-size: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scroll-indicator:hover {
            background: rgba(74, 222, 128, 0.7);
        }

        .scroll-indicator.show {
            display: flex;
        }

        /* TTS 指示器 */
        .tts-indicator {
            position: fixed;
            top: 70px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(99, 102, 241, 0.35);
            color: #fff;
            border-radius: 50%;
            font-size: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tts-indicator:hover {
            background: rgba(99, 102, 241, 0.7);
        }

        .tts-indicator.show {
            display: flex;
        }

        /* TTS 選擇器 */
        .tts-select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
        }

        .tts-rate-opt {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: transparent;
            color: var(--text-color);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tts-rate-opt:hover {
            background: var(--bg-color);
        }

        .tts-rate-opt.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: var(--button-bg);
        }

        /* 正在唸的段落 highlight */
        .chapter-content p.tts-speaking {
            background: rgba(99, 102, 241, 0.15);
            border-left: 3px solid #6366f1;
            margin-left: -3px;
            padding-left: 3px;
        }

        /* 背景音樂 */
        .music-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .music-item {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 14px;
        }

        .music-item:hover {
            background: var(--bg-color);
        }

        .music-item.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: var(--button-bg);
        }

        .music-item.playing {
            background: #4ade80;
            color: #000;
            border-color: #4ade80;
        }

        .music-slider {
            width: 100%;
            margin-top: 8px;
            margin-bottom: 8px;
            height: 44px;
            padding: 10px 0;
            cursor: pointer;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        .volume-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-controls .music-slider {
            flex: 1;
        }

        .volume-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .volume-btn:active {
            background: var(--button-bg);
            color: var(--button-text);
        }

        .play-mode-opt {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        .play-mode-opt.active {
            background: var(--button-bg);
            color: var(--button-text);
            border-color: var(--button-bg);
        }

        /* iOS/手機版隱藏音量控制 */
        @media (max-width: 1024px) {
            .volume-section {
                display: none;
            }
        }

        /* 下一章倒數提示 */
        .next-chapter-countdown {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--button-bg);
            color: var(--button-text);
            padding: 12px 20px;
            border-radius: 25px;
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 102;
            box-shadow: 0 4px 15px var(--shadow);
            font-size: 14px;
        }

        .next-chapter-countdown.show {
            display: flex;
        }

        .next-chapter-countdown button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: inherit;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
        }

        .next-chapter-countdown button:hover {
            background: rgba(255,255,255,0.3);
        }

        /* 音樂播放指示器 */
        .music-indicator {
            position: fixed;
            top: 70px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(74, 222, 128, 0.35);
            color: #000;
            border-radius: 50%;
            font-size: 14px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99;
            cursor: pointer;
            transition: all 0.2s;
        }

        .music-indicator:hover {
            background: rgba(74, 222, 128, 0.7);
        }

        .music-indicator.show {
            display: flex;
        }

        /* 手機版指示器位置調整 */
        @media (max-width: 1024px) {
            .scroll-indicator {
                top: 65px;
                right: 5px;
                width: 32px;
                height: 32px;
            }
            .tts-indicator {
                top: 65px;
                right: 5px;
                width: 32px;
                height: 32px;
            }
            .music-indicator {
                top: 65px;
                right: 5px;
                width: 32px;
                height: 32px;
            }
        }

        /* 用戶選單 */
        .user-menu {
            position: relative;
            display: flex;
            align-items: center;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border-color);
            box-sizing: border-box;
        }

        @media (max-width: 1024px) {
            .user-avatar {
                width: 36px;
                height: 36px;
            }
        }

        .user-dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 0;
            min-width: 150px;
            box-shadow: 0 4px 20px var(--shadow);
            display: none;
            z-index: 102;
        }

        .user-dropdown.show {
            display: block;
        }

        .user-dropdown-item {
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.2s;
            display: block;
            text-decoration: none;
            color: var(--text-color);
        }

        .user-dropdown-item:hover {
            background: var(--bg-color);
        }

        /* RWD */
        @media (max-width: 1024px) {
            .header h1 {
                display: none;
            }
            
            .chapter-content {
                font-size: 16px;
            }
            
            .sidebar {
                width: 85%;
                left: -85%;
            }
            
            .btn {
                padding: 6px 10px;
                font-size: 13px;
            }
            
            /* 手機版隱藏設定按鈕 */
            .desktop-only {
                display: none !important;
            }
        }
        
        /* 電腦版隱藏選單內的設定項目 */
        @media (min-width: 1025px) {
            .mobile-only {

        // HTML 轉義：所有從 DB 讀出、要進 innerHTML 的字串都必須先過這層（防 stored XSS / 版面破壞）
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));

        // ============ 離線快取（localStorage） ============
        // 注意：RTDB 的 set() 離線時會排隊、promise 到回線才 resolve —— 開機/UI 流程一律
        // fire-and-forget（set(...).catch(...)），絕對不要 await，否則離線會整個卡死。
        const chapCacheKey     = (num) => `novel-cache:${currentBookId}:${num}`;
        const chapIdxKey       = () => `novel-cache-idx:${currentBookId}`;
        const tocCacheKey      = () => `novel-toc:${currentBookId}`;
        const progressCacheKey = () => `novel-progress:${currentBookId}`;
        const bookmarkCacheKey = () => `novel-bookmark:${currentBookId}`;
        const CACHE_MAX_CHAPTERS = 80;   // 每本書最多快取章數（LRU 淘汰）

        function lsGetJson(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
        function lsSetJson(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }

        // 寫進度的唯一入口：本機鏡像直接落地，遠端只在「比伺服器上那筆新」時才蓋。
        // 為何不用 set()：RTDB 是「到達順序」決勝、不看 updatedAt，離線佇列 flush 出去的舊進度
        // 會直接蓋掉別台的新進度（而且蓋完 updatedAt 也是舊的，開書時的比較邏輯救不回來）。
        // transaction 在回線時會拿伺服器實際值重跑，正好是要的語意。一樣 fire-and-forget，別 await。
        function writeProgress(pos) {
            lsSetJson(progressCacheKey(), pos);
            runTransaction(progressRef(), cur =>
                (cur && (cur.updatedAt || 0) >= (pos.updatedAt || 0)) ? undefined : pos   // undefined = abort
            ).catch(() => {});
        }

        function cacheGetChapter(num) { return lsGetJson(chapCacheKey(num)); }
        function cachePutChapter(num, chapter) {
            const data = { title: chapter.title, content: chapter.content };
            let idx = (lsGetJson(chapIdxKey()) || []).filter(n => n !== num);
            while (idx.length >= CACHE_MAX_CHAPTERS) localStorage.removeItem(chapCacheKey(idx.shift()));
            let ok = lsSetJson(chapCacheKey(num), data);
            while (!ok && idx.length) {   // localStorage 配額滿：邊淘汰最舊的邊重試
                localStorage.removeItem(chapCacheKey(idx.shift()));
                ok = lsSetJson(chapCacheKey(num), data);
            }
            if (ok) idx.push(num);
            lsSetJson(chapIdxKey(), idx);
        }

        // get() 加 timeout：離線/機上 wifi 假連線時不讓流程卡死。失敗回 null（呼叫端走快取）
        function tryGet(r, ms = 8000) {
            return Promise.race([
                get(r),
                new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
            ]).catch(() => null);
        }

        // ============ 書架登記表（含舊版資料搬移） ============
        async function ensureShelf() {
            const snap = await tryGet(ref(db, 'novel/shelf'));
            if (snap === null) {
                // 離線：用快取書架（第一次上線跑過就會有）
                shelf = lsGetJson('novel-shelf-cache') || {};
                return;
            }
            shelf = snap.exists() ? snap.val() : {};
            lsSetJson('novel-shelf-cache', shelf);

            // 第一次跑：把舊版「凡人修仙傳」登記進書架（資料仍留在 novel/，不搬章節）
            if (!shelf.fanren) {
                const infoSnap = await get(ref(db, 'novel/info'));
                const title = infoSnap.exists() ? (infoSnap.val().title || '凡人修仙傳') : '凡人修仙傳';
                const entry = { title, author: '忘語', dataPath: 'novel', order: 0, createdAt: Date.now() };
                await set(ref(db, 'novel/shelf/fanren'), entry);
                shelf.fanren = entry;

                // 把舊的書籤/進度搬到 novel/state/fanren（只有第一次）
                const bmSnap = await get(ref(db, 'novel/bookmark'));
                if (bmSnap.exists() && bmSnap.val()) await set(ref(db, 'novel/state/fanren/bookmark'), bmSnap.val());
                const pgSnap = await get(ref(db, 'novel/progress'));
                if (pgSnap.exists()) await set(ref(db, 'novel/state/fanren/progress'), pgSnap.val());
            }
        }

        // ============ 載入一本書 ============
        async function loadBook(bookId) {
            // 清掉上一本的監聽/存檔，避免 listener 累積
            if (bookmarkListenerUnsub) { bookmarkListenerUnsub(); bookmarkListenerUnsub = null; }
            stopAutoSave();
            cancelNextChapterCountdown();

            currentBookId = bookId;
            // 離線且無快取書架時，fanren 的資料在舊路徑 novel/，不能落到 novel/books/fanren
            bookDataPath = shelf[bookId]?.dataPath || (bookId === 'fanren' ? 'novel' : `novel/books/${bookId}`);
            localStorage.setItem('novel-lastBook', bookId);
            set(ref(db, 'novel/state/lastBook'), bookId).catch(() => {});

            // 重置畫面
            chapters = [];
            currentChapterIndex = 1;
            chapterView.style.display = 'none';
            chapterContent.innerHTML = '';
            loadingScreen.style.display = 'flex';
            loadingScreen.innerHTML = '<div class="loading-spinner"></div><p>正在載入...</p>';

            // 書名（離線退書架快取）
            const infoSnap = await tryGet(infoRef());
            bookTitle.textContent = (infoSnap && infoSnap.exists())
                ? (infoSnap.val().title || shelf[bookId]?.title || '小說閱讀器')
                : (shelf[bookId]?.title || '小說閱讀器');

            // 章節目錄：優先讀輕量 toc（省流量），舊書沒有 toc 時讀一次全章並順手建好；離線退快取目錄
            let offline = false;
            const tocSnap = await tryGet(tocRef());
            if (tocSnap && tocSnap.exists()) {
                const toc = tocSnap.val();
                chapters = Object.keys(toc).map(key => ({
                    num: parseInt(key),
                    title: toc[key]
                })).sort((a, b) => a.num - b.num);
            } else if (tocSnap) {
                const chaptersSnap = await tryGet(chaptersRef());
                if (chaptersSnap && chaptersSnap.exists()) {
                    const data = chaptersSnap.val();
                    chapters = Object.keys(data).map(key => ({
                        num: parseInt(key),
                        title: data[key].title
                    })).sort((a, b) => a.num - b.num);
                    // 順手建立 toc，之後開書就不必再整包下載
                    const toc = {};
                    Object.keys(data).forEach(k => { toc[k] = data[k].title; });
                    set(tocRef(), toc).catch(e => console.warn('建立 toc 失敗', e));
                }
            } else {
                offline = true;
                chapters = lsGetJson(tocCacheKey()) || [];
            }

            if (chapters.length === 0) {
                loadingScreen.innerHTML = offline
                    ? '<p>📡 離線中，這本書沒有快取目錄</p><p style="margin-top:10px;opacity:.7;">回到有網路時開一次書即可</p>'
                    : `
                    <p>這本書還沒有章節</p>
                    <p style="margin-top: 20px;">
                        <a href="novel-uploader.html" style="color: #4a90d9;">👉 前往上傳</a>
                    </p>`;
                return;
            }

            totalChapters = chapters.length;
            renderChapterList();
            lsSetJson(tocCacheKey(), chapters);   // 目錄留一份本機（離線開書要靠它）

            // 決定接續位置：書籤 vs 進度，比 updatedAt 取較新者（都沒有 → 第一章）
            let resumeChapter = chapters[0].num;
            resumeParagraph = null;
            let useBookmark = false;

            const [bmSnap, pgSnap] = await Promise.all([tryGet(bookmarkRef()), tryGet(progressRef())]);
            let bm = (bmSnap && bmSnap.exists() && bmSnap.val()) ? bmSnap.val() : null;
            let pg = (pgSnap && pgSnap.exists()) ? pgSnap.val() : null;
            if (!bm && bmSnap === null) bm = lsGetJson(bookmarkCacheKey());   // 離線退書籤鏡像
            // 本機進度鏡像可能比遠端新（上次離線讀的）→ 用它並回寫遠端
            const localPg = lsGetJson(progressCacheKey());
            if (localPg && (!pg || (localPg.updatedAt || 0) > (pg.updatedAt || 0))) {
                pg = localPg;
                writeProgress(localPg);
            }
            if (bm && (!pg || (bm.updatedAt || 0) >= (pg.updatedAt || 0))) {
                resumeChapter = bm.chapter;
                useBookmark = true;           // 段落交給 showChapter→loadBookmark 自動跳
            } else if (pg) {
                resumeChapter = pg.chapter || resumeChapter;
                const p = pg.paragraph;
                resumeParagraph = (p === undefined ? null : p);
            }
            if (!chapters.some(c => c.num === resumeChapter)) resumeChapter = chapters[0].num;

            loadingScreen.style.display = 'none';
            lastSavedPos = null;
            // resume 開書不寫 progress（避免洗掉其他裝置的較新位置）；
            // 以進度接續時不自動跳書籤，避免兩個捲動互搶
            await showChapter(resumeChapter, { isResume: true, skipBookmarkJump: !useBookmark });

            // resume 後把「上次寫入位置」的基準補上：留 null 的話「位置沒變就不寫」的 guard 會失效，
            // 3 分鐘保險網會把剛讀回來的位置配新 timestamp 再寫一次，蓋掉其他裝置的較新進度
            lastSavedPos = {
                chapter: resumeChapter,
                paragraph: useBookmark ? (bm && bm.paragraph) || 0 : resumeParagraph || 0
            };

            // 以進度接續時，跳到進度段落
            if (!useBookmark && resumeParagraph !== null) {
                setTimeout(() => {
                    const targetP = chapterContent.querySelector(`[data-index="${resumeParagraph}"]`);
                    if (targetP) targetP.scrollIntoView({ behavior: 'auto', block: 'center' });
                }, 150);
            }

            startAutoSave();
            attachBookmarkListener();
        }

        // ============ 切換書（書架） ============
        async function switchBook(bookId) {
            if (bookId === currentBookId) { closeBookShelf(); return; }
            closeBookShelf();
            // 重新抓書架（可能在上傳器新增了書；離線就沿用手上的）

            await loadBook(bookId);

        // ============ 離線預載（目前章節 -2 ~ +30，存 localStorage） ============
        const menuPrefetch = document.getElementById('menuPrefetch');
        let prefetching = false;

        async function prefetchChapters() {
            if (prefetching || chapters.length === 0) return;
            prefetching = true;

            const i = Math.max(0, chapters.findIndex(ch => ch.num === currentChapterIndex));
            const targets = chapters.slice(Math.max(0, i - 2), i + 31).map(ch => ch.num);

            // 離線開書需要的周邊資料也留一份
            lsSetJson(tocCacheKey(), chapters);
            lsSetJson('novel-shelf-cache', shelf);
            localStorage.setItem('novel-lastBook', currentBookId);

            let done = 0, failed = 0;
            for (const num of targets) {
                if (!cacheGetChapter(num)) {
                    const snap = await tryGet(chapterRef(num));
                    if (snap && snap.exists()) cachePutChapter(num, snap.val());
                    else { failed++; continue; }
                }
                done++;
                menuPrefetch.textContent = `⬇️ 預載中 ${done}/${targets.length}`;
            }

            menuPrefetch.textContent = failed > 0
                ? `⚠️ 預載完成 ${done} 章，${failed} 章失敗`
                : `✅ 已預載 ${done} 章，可離線閱讀`;
            setTimeout(() => { menuPrefetch.textContent = '⬇️ 離線預載'; }, 5000);
            prefetching = false;
        }

        menuPrefetch.addEventListener('click', prefetchChapters);

                btn.classList.add('active');
                localStorage.setItem('novel-scrollInterval', scrollIntervalTime);
            });
        });

        document.querySelectorAll('.scroll-opt[data-speed]').forEach(btn => {
            btn.addEventListener('click', () => {
                scrollSpeed = parseFloat(btn.dataset.speed);
                document.querySelectorAll('.scroll-opt[data-speed]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                localStorage.setItem('novel-scrollSpeed', scrollSpeed);
            });
        });

        document.querySelectorAll('.scroll-opt[data-lines]').forEach(btn => {
            btn.addEventListener('click', () => {
                scrollLines = parseInt(btn.dataset.lines);
                document.querySelectorAll('.scroll-opt[data-lines]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                localStorage.setItem('novel-scrollLines', scrollLines);
            });
        });

        // 開始/停止自動捲動
        function smoothScrollBy(distance, duration) {
            const start = window.scrollY;
            const startTime = performance.now();
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // easeInOutCubic 緩動函數
                const easeProgress = progress < 0.5
                    ? 4 * progress * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;
                
                window.scrollTo(0, start + distance * easeProgress);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            
            requestAnimationFrame(animate);
        }

        function startAutoScroll() {
            // 確保之前的狀態已清除
            if (autoScrollInterval) {
                clearTimeout(autoScrollInterval);
                autoScrollInterval = null;
            }
            
            isAutoScrolling = true;
            let scrollCount = 0; // 計數器，避免剛開始就判斷到底
            
            function doScroll() {
                // 每次捲動時即時計算，這樣調整參數會立即生效
                const lineHeightRatio = window.innerWidth >= 1024 ? 1.5 : 1.7;
                const lineHeight = fontSize * lineHeightRatio;
                const scrollDistance = lineHeight * scrollLines;
                
                smoothScrollBy(scrollDistance, scrollSpeed * 1000);
                scrollCount++;
                
                // 至少捲動 3 次後才檢查是否到底部（避免換章後誤判）
                // 同時確保頁面高度大於視窗高度（內容已載入）
                const pageHeight = document.body.scrollHeight;
                const viewportHeight = window.innerHeight;
                if (scrollCount > 3 && pageHeight > viewportHeight * 1.5 && 
                    (viewportHeight + window.scrollY) >= pageHeight - 100) {
                    // 到底部了，啟動倒數
                    stopAutoScroll();
                    startNextChapterCountdown();
                }
            }
            
            // 使用 setTimeout 遞迴，這樣每次都能用最新的 scrollIntervalTime
            function scheduleNext() {
                autoScrollInterval = setTimeout(() => {
                    if (isAutoScrolling) {
                        doScroll();
                        scheduleNext();
                    }
                }, scrollIntervalTime * 1000);
            }
            
            // 更新 UI 狀態（先更新，讓使用者知道已啟動）
            scrollStartBtn.textContent = '⏹️ 停止自動捲動';
            scrollStartBtn.classList.add('active');
            scrollIndicator.classList.add('show');
            scrollPopup.classList.remove('show');
            
            // 更新指示器位置
            if (typeof updateIndicatorPositions === 'function') {
                updateIndicatorPositions();
            }
            
            // 快捷按鈕變暗
            quickScrollBtn.style.opacity = '0.4';
            quickScrollBtn.style.pointerEvents = 'none';
            
            // 只在手機版自動收起工具列
            if (window.innerWidth <= 1024) {
                header.classList.add('hidden');
                footerNav.classList.add('hidden');
            }
            
            // 延遲 500ms 才開始，確保換章後頁面內容已載入
            setTimeout(() => {
                if (isAutoScrolling) {
                    doScroll();
                    scheduleNext();
                }
            }, 500);
        }

        // ============ 下一章倒數功能 ============
        const nextChapterCountdown = document.getElementById('nextChapterCountdown');
        const countdownText = document.getElementById('countdownText');
        const cancelCountdown = document.getElementById('cancelCountdown');
        let countdownTimer = null;
        let countdownSeconds = 8;

        function startNextChapterCountdown() {
            // 檢查是否有下一章
            const currentIndex = chapters.findIndex(ch => ch.num === currentChapterIndex);
            if (currentIndex >= chapters.length - 1) {
                // 沒有下一章了
                return;
            }
            
            countdownSeconds = 8;
            countdownText.textContent = `${countdownSeconds} 秒後下一章`;
            nextChapterCountdown.classList.add('show');
            
            countdownTimer = setInterval(async () => {
                countdownSeconds--;
                countdownText.textContent = `${countdownSeconds} 秒後下一章`;
                
                if (countdownSeconds <= 0) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    nextChapterCountdown.classList.remove('show');
                    
                    // 跳下一章並繼續播放
                    await goToNextChapter();
                    // 等待頁面渲染完成後再開始自動捲動
                    setTimeout(() => {
                        startAutoScroll();
                    }, 1000);
                }
            }, 1000);
        }

        function cancelNextChapterCountdown() {
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            nextChapterCountdown.classList.remove('show');
        }

        cancelCountdown.addEventListener('click', cancelNextChapterCountdown);

        function stopAutoScroll() {
            if (autoScrollInterval) {
                clearTimeout(autoScrollInterval);
                autoScrollInterval = null;
            }
            isAutoScrolling = false;
            scrollStartBtn.textContent = '▶️ 開始自動捲動';
            scrollStartBtn.classList.remove('active');
            scrollIndicator.classList.remove('show');
            
            // 更新指示器位置
            if (typeof updateIndicatorPositions === 'function') {
                updateIndicatorPositions();
            }
            
            // 快捷按鈕恢復
            quickScrollBtn.style.opacity = '1';
            quickScrollBtn.style.pointerEvents = 'auto';
        }

        // 快捷按鈕點擊
        quickScrollBtn.addEventListener('click', () => {
            startAutoScroll();
        });

        scrollStartBtn.addEventListener('click', () => {
            if (autoScrollInterval) {
                stopAutoScroll();
            } else {
                startAutoScroll();
            }
        });

        scrollIndicator.addEventListener('click', stopAutoScroll);

        // ============ 載入設定 ============
        function loadSettings() {
            const savedTheme = localStorage.getItem('novel-theme');
            if (savedTheme === 'dark') {

                fontSize = parseInt(savedFontSize);

                // 根據螢幕寬度設定預設字體：手機 20，電腦 26

            fontSizeDisplay.textContent = fontSize;
            
            // 載入字體粗度
