<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小說閱讀器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 淺色模式 */
        :root {
            --bg-color: #f5f5dc;
            --text-color: #333;
            --header-bg: #fff;
            --border-color: #ddd;
            --button-bg: #4a4a4a;
            --button-text: #fff;
            --chapter-bg: #fff;
            --shadow: rgba(0,0,0,0.1);
        }

        /* 深色模式 */
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #c0c0c0;
            --header-bg: #2d2d2d;
            --border-color: #444;
            --button-bg: #555;
            --button-text: #fff;
            --chapter-bg: #252525;
            --shadow: rgba(0,0,0,0.3);
        }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            transition: all 0.3s ease;
        }

        /* 頂部導航列 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            box-shadow: 0 2px 10px var(--shadow);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: normal;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* 按鈕樣式 */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: var(--button-bg);
            color: var(--button-text);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 側邊章節目錄 */
        .sidebar {
            position: fixed;
            top: 60px;
            left: -300px;
            width: 300px;
            height: calc(100vh - 60px);
            background: var(--header-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            transition: left 0.3s ease;
            z-index: 99;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
        }

        .chapter-list {
            list-style: none;
        }

        .chapter-list li {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .chapter-list li:hover {
            background: var(--bg-color);
        }

        .chapter-list li.active {
            background: var(--button-bg);
            color: var(--button-text);
        }

        /* 遮罩 */
        .overlay {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 98;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* 主要內容區 */
        .main-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 20px 100px;
        }

        .chapter-title {
            font-size: 1.5rem;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .chapter-content {
            font-size: 18px;
            text-align: justify;
            white-space: pre-wrap;
        }

        .chapter-content p {
            margin-bottom: 1.5em;
            text-indent: 2em;
        }

        /* 底部導航 */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 100;
        }

        /* 字體大小控制 */
        .font-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .font-size-display {
            min-width: 40px;
            text-align: center;
        }

        /* 載入提示 */
        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        /* 檔案上傳區 */
        .upload-area {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            text-align: center;
            border: 3px dashed var(--border-color);
            border-radius: 15px;
            background: var(--chapter-bg);
        }

        .upload-area h2 {
            margin-bottom: 20px;
        }

        .upload-area p {
            margin-bottom: 20px;
            color: #888;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-label {
            display: inline-block;
            padding: 15px 30px;
            background: var(--button-bg);
            color: var(--button-text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .upload-label:hover {
            opacity: 0.85;
        }

        /* RWD */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1rem;
            }
            
            .chapter-content {
                font-size: 16px;
            }
            
            .sidebar {
                width: 80%;
                left: -80%;
            }
        }
    </style>
</head>
<body>
    <!-- 頂部導航 -->
    <header class="header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <button class="btn btn-icon" id="menuBtn" title="章節目錄">☰</button>
            <h1 id="bookTitle">小說閱讀器</h1>
        </div>
        <div class="header-controls">
            <div class="font-controls">
                <button class="btn" id="fontSmaller">A-</button>
                <span class="font-size-display" id="fontSizeDisplay">18</span>
                <button class="btn" id="fontLarger">A+</button>
            </div>
            <button class="btn btn-icon" id="themeToggle" title="開關燈">🌙</button>
        </div>
    </header>

    <!-- 側邊目錄 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">📚 章節目錄</div>
        <ul class="chapter-list" id="chapterList">
            <!-- 動態生成 -->
        </ul>
    </aside>

    <!-- 遮罩 -->
    <div class="overlay" id="overlay"></div>

    <!-- 主內容 -->
    <main class="main-content" id="mainContent">
        <div class="upload-area" id="uploadArea">
            <h2>📖 小說閱讀器</h2>
            <p>請上傳小說 TXT 檔案（可多選）</p>
            <label class="upload-label">
                選擇檔案
                <input type="file" id="fileInput" accept=".txt" multiple>
            </label>
            <p style="margin-top: 20px; font-size: 14px;">
                或將整個資料夾的 TXT 檔案拖曳到此處
            </p>
        </div>

        <article id="chapterView" style="display: none;">
            <h2 class="chapter-title" id="chapterTitle"></h2>
            <div class="chapter-content" id="chapterContent"></div>
        </article>
    </main>

    <!-- 底部導航 -->
    <nav class="footer-nav" id="footerNav" style="display: none;">
        <button class="btn" id="prevChapter">⬅ 上一章</button>
        <span id="chapterProgress">1 / 1</span>
        <button class="btn" id="nextChapter">下一章 ➡</button>
    </nav>

    <script>
        // ============ 狀態管理 ============
        let chapters = [];
        let currentChapterIndex = 0;
        let fontSize = 18;
        let isDarkMode = false;

        // ============ DOM 元素 ============
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const themeToggle = document.getElementById('themeToggle');
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const chapterView = document.getElementById('chapterView');
        const chapterTitle = document.getElementById('chapterTitle');
        const chapterContent = document.getElementById('chapterContent');
        const chapterList = document.getElementById('chapterList');
        const footerNav = document.getElementById('footerNav');
        const prevBtn = document.getElementById('prevChapter');
        const nextBtn = document.getElementById('nextChapter');
        const chapterProgress = document.getElementById('chapterProgress');
        const fontSmaller = document.getElementById('fontSmaller');
        const fontLarger = document.getElementById('fontLarger');
        const fontSizeDisplay = document.getElementById('fontSizeDisplay');
        const bookTitle = document.getElementById('bookTitle');

        // ============ 開關燈功能 ============
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
            themeToggle.textContent = isDarkMode ? '☀️' : '🌙';
            localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
        }

        // 讀取儲存的主題
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            isDarkMode = true;
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '☀️';
        }

        themeToggle.addEventListener('click', toggleTheme);

        // ============ 側邊欄控制 ============
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // ============ 字體大小控制 ============
        function updateFontSize(delta) {
            fontSize = Math.max(12, Math.min(32, fontSize + delta));
            chapterContent.style.fontSize = fontSize + 'px';
            fontSizeDisplay.textContent = fontSize;
            localStorage.setItem('fontSize', fontSize);
        }

        // 讀取儲存的字體大小
        const savedFontSize = localStorage.getItem('fontSize');
        if (savedFontSize) {
            fontSize = parseInt(savedFontSize);
            fontSizeDisplay.textContent = fontSize;
        }

        fontSmaller.addEventListener('click', () => updateFontSize(-2));
        fontLarger.addEventListener('click', () => updateFontSize(2));

        // ============ 檔案處理 ============
        fileInput.addEventListener('change', handleFiles);

        // 拖曳上傳
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#4a90d9';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '';
            handleFiles({ target: { files: e.dataTransfer.files } });
        });

        async function handleFiles(e) {
            const files = Array.from(e.target.files).filter(f => f.name.endsWith('.txt'));
            
            if (files.length === 0) {
                alert('請選擇 TXT 檔案');
                return;
            }

            // 按檔名排序
            files.sort((a, b) => a.name.localeCompare(b.name, 'zh-TW', { numeric: true }));

            chapters = [];

            for (const file of files) {
                const content = await readFile(file);
                const lines = content.split('\n');
                
                // 取得標題（第一行或檔名）
                let title = lines[0]?.trim() || file.name.replace('.txt', '');
                
                // 如果標題是分隔線，用檔名
                if (title.startsWith('=')) {
                    title = file.name.replace('.txt', '').replace(/^\d+_/, '');
                }

                // 找正文（跳過標題和分隔線）
                let contentStart = 0;
                for (let i = 0; i < Math.min(5, lines.length); i++) {
                    if (lines[i].startsWith('=')) {
                        contentStart = i + 1;
                        break;
                    }
                }

                const chapterContent = lines.slice(contentStart).join('\n').trim();

                chapters.push({
                    title: title,
                    content: chapterContent
                });
            }

            if (chapters.length > 0) {
                // 更新書名
                bookTitle.textContent = '凡人修仙傳';
                
                // 更新章節目錄
                renderChapterList();
                
                // 顯示第一章
                showChapter(0);
                
                // 隱藏上傳區，顯示閱讀區
                uploadArea.style.display = 'none';
                chapterView.style.display = 'block';
                footerNav.style.display = 'flex';
            }
        }

        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsText(file, 'UTF-8');
            });
        }

        // ============ 章節顯示 ============
        function renderChapterList() {
            chapterList.innerHTML = chapters.map((ch, idx) => 
                `<li data-index="${idx}" class="${idx === currentChapterIndex ? 'active' : ''}">${ch.title}</li>`
            ).join('');

            // 點擊事件
            chapterList.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', () => {
                    showChapter(parseInt(li.dataset.index));
                    toggleSidebar();
                });
            });
        }

        function showChapter(index) {
            if (index < 0 || index >= chapters.length) return;

            currentChapterIndex = index;
            const chapter = chapters[index];

            chapterTitle.textContent = chapter.title;
            
            // 將內容轉換成段落
            const paragraphs = chapter.content
                .split(/\n\s*\n/)
                .filter(p => p.trim())
                .map(p => `<p>${p.trim()}</p>`)
                .join('');
            
            chapterContent.innerHTML = paragraphs || `<p>${chapter.content}</p>`;
            chapterContent.style.fontSize = fontSize + 'px';

            // 更新進度
            chapterProgress.textContent = `${index + 1} / ${chapters.length}`;

            // 更新目錄高亮
            chapterList.querySelectorAll('li').forEach((li, idx) => {
                li.classList.toggle('active', idx === index);
            });

            // 捲動到頂部
            window.scrollTo(0, 0);

            // 儲存閱讀進度
            localStorage.setItem('lastChapter', index);
        }

        // ============ 上下章切換 ============
        prevBtn.addEventListener('click', () => showChapter(currentChapterIndex - 1));
        nextBtn.addEventListener('click', () => showChapter(currentChapterIndex + 1));

        // 鍵盤快捷鍵
        document.addEventListener('keydown', (e) => {
            if (chapters.length === 0) return;
            
            if (e.key === 'ArrowLeft') {
                showChapter(currentChapterIndex - 1);
            } else if (e.key === 'ArrowRight') {
                showChapter(currentChapterIndex + 1);
            }
        });

        // ============ 讀取上次閱讀進度 ============
        const lastChapter = localStorage.getItem('lastChapter');
        if (lastChapter && chapters.length > 0) {
            showChapter(parseInt(lastChapter));
        }
    </script>
</body>
</html>
