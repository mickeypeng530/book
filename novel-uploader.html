<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小說管理工具</title>
    <link rel="icon" type="image/png" href="favicon-48.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#141c3a">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        
        /* 登入區 */
        .login-area {
            text-align: center;
            padding: 60px 40px;
        }
        
        .login-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 15px 30px;
            background: #fff;
            color: #333;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .login-btn img {
            width: 24px;
            height: 24px;
        }
        
        /* 頂部用戶區 */
        .user-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .user-bar.show {
            display: flex;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-info img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }
        
        .user-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn:hover {
            background: #3a7bc8;
        }
        
        .btn-green {
            background: #4ade80;
        }
        
        .btn-green:hover {
            background: #22c55e;
        }
        
        .btn-red {
            background: #f87171;
        }
        
        .btn-red:hover {
            background: #ef4444;
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
        }
        
        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
        }
        
        /* 書籍選擇列 */
        .book-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .book-bar-label { color: #aaa; font-size: 14px; }
        .book-select {
            flex: 1;
            min-width: 180px;
            padding: 10px 12px;
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 15px;
        }
        .new-book-form {
            display: none;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 16px;
            gap: 10px;
            flex-direction: column;
        }
        .new-book-form.show { display: flex; }
        .new-book-form input {
            padding: 10px 12px;
            background: #1a1a2e;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 15px;
        }
        .new-book-actions { display: flex; gap: 10px; }

        /* 分頁標籤 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 12px 24px;
            background: rgba(255,255,255,0.05);
            border: none;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
        }
        
        .tab.active {
            background: #4a90d9;
            color: #fff;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 上傳區 */
        .upload-area {
            background: rgba(255,255,255,0.05);
            border: 3px dashed rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 50px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover, .upload-area.dragover {
            border-color: #4a90d9;
            background: rgba(74, 144, 217, 0.1);
        }
        
        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        /* 進度區 */
        .progress-section {
            margin-top: 20px;
            display: none;
        }
        
        .progress-bar {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 24px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a90d9, #63b3ed);
            border-radius: 10px;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status {
            text-align: center;
            color: #aaa;
            font-size: 14px;
        }
        
        /* 章節管理區 */
        .chapter-manager {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
        }
        
        .manager-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .manager-header h3 {
            font-size: 1.1rem;
        }
        
        .chapter-stats {
            color: #4ade80;
            font-size: 14px;
        }
        
        .chapter-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .chapter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        
        .chapter-item:hover {
            background: rgba(255,255,255,0.08);
        }
        
        .chapter-title {
            flex: 1;
            font-size: 14px;
            color: #ccc;
        }
        
        .chapter-num {
            color: #4a90d9;
            font-weight: bold;
            margin-right: 10px;
            min-width: 60px;
        }
        
        .delete-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid #f87171;
            color: #f87171;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .delete-btn:hover {
            background: #f87171;
            color: #fff;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        /* 確認彈窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            text-align: center;
        }
        
        .modal-content h3 {
            margin-bottom: 15px;
            color: #f87171;
        }
        
        .modal-content p {
            margin-bottom: 20px;
            color: #aaa;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        /* 載入中 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4a90d9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* RWD */
        @media (max-width: 600px) {
            .user-bar {
                flex-direction: column;
                gap: 15px;
            }
            
            .tabs {
                flex-wrap: wrap;
            }
            
            .tab {
                flex: 1;
                text-align: center;
            }
            
            .manager-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 小說管理工具</h1>
        <p class="subtitle">上傳、管理你的小說章節</p>
        
        <!-- 登入區 -->
        <div class="login-area" id="loginArea">
            <p style="margin-bottom: 30px; color: #aaa;">請先登入</p>
            <button class="login-btn" id="loginBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                使用 Google 登入
            </button>
        </div>
        
        <!-- 用戶工具列 -->
        <div class="user-bar" id="userBar">
            <div class="user-info">
                <img id="userPhoto" src="" alt="頭像">
                <span id="userName"></span>
            </div>
            <div class="user-actions">
                <a href="index.html" class="btn btn-green">📖 前往閱讀</a>
                <button class="btn btn-outline" id="logoutBtn">登出</button>
            </div>
        </div>
        
        <!-- 主要內容 -->
        <div id="mainContent" style="display: none;">
            <!-- 書籍選擇列 -->
            <div class="book-bar">
                <span class="book-bar-label">📖 目前書籍</span>
                <select id="bookSelect" class="book-select"></select>
                <button class="btn" id="newBookBtn">➕ 新增書</button>
            </div>

            <!-- 新增書表單（預設隱藏） -->
            <div class="new-book-form" id="newBookForm">
                <input type="text" id="newBookTitle" placeholder="書名（例：Buy Back Your Time 繁中版）">
                <input type="text" id="newBookAuthor" placeholder="作者（可留空）">
                <div class="new-book-actions">
                    <button class="btn btn-green" id="createBookBtn">建立</button>
                    <button class="btn btn-outline" id="cancelBookBtn">取消</button>
                </div>
            </div>

            <!-- 分頁 -->
            <div class="tabs">
                <button class="tab active" data-tab="upload">📤 上傳章節</button>
                <button class="tab" data-tab="manage">📋 管理章節</button>
            </div>
            
            <!-- 上傳分頁 -->
            <div class="tab-content active" id="tab-upload">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <h2>選擇或拖曳 TXT 檔案</h2>
                    <p style="color: #888; margin-top: 10px;">會自動從標題提取章節號</p>
                    <label class="btn" style="margin-top: 20px;">
                        選擇檔案
                        <input type="file" id="fileInput" accept=".txt" multiple>
                    </label>
                </div>
                
                <div class="progress-section" id="progressSection">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
                    </div>
                    <p class="status" id="statusText">準備上傳...</p>
                </div>
            </div>
            
            <!-- 管理分頁 -->
            <div class="tab-content" id="tab-manage">
                <div class="chapter-manager">
                    <div class="manager-header">
                        <h3>已上傳章節</h3>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <span class="chapter-stats" id="chapterStats">載入中...</span>
                            <button class="btn btn-red" id="deleteAllBtn" style="display: none;">🗑️ 全部刪除</button>
                        </div>
                    </div>
                    <div class="chapter-list" id="chapterList">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>載入中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 刪除確認彈窗 -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3>⚠️ 確認刪除</h3>
            <p id="deleteMessage">確定要刪除這個章節嗎？</p>
            <div class="modal-actions">
                <button class="btn btn-outline" id="cancelDelete">取消</button>
                <button class="btn btn-red" id="confirmDelete">刪除</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithPopup, signOut, onAuthStateChanged, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        // Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyATCaOlYxkYTle1hPzYAcuXNlQHaAuO3-8",
            authDomain: "case-scheduler-f752b.firebaseapp.com",
            databaseURL: "https://case-scheduler-f752b-default-rtdb.firebaseio.com",
            projectId: "case-scheduler-f752b",
            storageBucket: "case-scheduler-f752b.firebasestorage.app",
            messagingSenderId: "703006186929",
            appId: "1:703006186929:web:57ac5b059678005455f190"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        
        // 狀態
        let chaptersData = {};
        let deleteTarget = null;
        let shelf = {};
        let currentBookId = 'fanren';
        let currentDataPath = 'novel';

        // 依目前書解析路徑
        const chaptersPath = () => `${currentDataPath}/chapters`;
        const infoPath = () => `${currentDataPath}/info`;
        
        // DOM 元素
        const loginArea = document.getElementById('loginArea');
        const loginBtn = document.getElementById('loginBtn');
        const userBar = document.getElementById('userBar');
        const userPhoto = document.getElementById('userPhoto');
        const userName = document.getElementById('userName');
        const logoutBtn = document.getElementById('logoutBtn');
        const mainContent = document.getElementById('mainContent');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progressSection = document.getElementById('progressSection');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const chapterList = document.getElementById('chapterList');
        const chapterStats = document.getElementById('chapterStats');
        const deleteModal = document.getElementById('deleteModal');
        const deleteMessage = document.getElementById('deleteMessage');
        const cancelDelete = document.getElementById('cancelDelete');
        const confirmDelete = document.getElementById('confirmDelete');
        const deleteAllBtn = document.getElementById('deleteAllBtn');
        const bookSelect = document.getElementById('bookSelect');
        const newBookBtn = document.getElementById('newBookBtn');
        const newBookForm = document.getElementById('newBookForm');
        const newBookTitle = document.getElementById('newBookTitle');
        const newBookAuthor = document.getElementById('newBookAuthor');
        const createBookBtn = document.getElementById('createBookBtn');
        const cancelBookBtn = document.getElementById('cancelBookBtn');

        let deleteAll = false;

        // HTML 轉義：DB 讀出要進 innerHTML 的字串一律先過這層
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        // ============ 書架 ============
        async function ensureShelf() {
            const snap = await get(ref(db, 'novel/shelf'));
            shelf = snap.exists() ? snap.val() : {};
            if (!shelf.fanren) {
                const infoSnap = await get(ref(db, 'novel/info'));
                const title = infoSnap.exists() ? (infoSnap.val().title || '凡人修仙傳') : '凡人修仙傳';
                const entry = { title, author: '忘語', dataPath: 'novel', order: 0, createdAt: Date.now() };
                await set(ref(db, 'novel/shelf/fanren'), entry);
                shelf.fanren = entry;
            }
        }

        function populateBookSelect() {
            const books = Object.keys(shelf)
                .map(id => ({ id, ...shelf[id] }))
                .sort((a, b) => (a.order || 0) - (b.order || 0));
            bookSelect.innerHTML = books.map(b =>
                `<option value="${b.id}">${escapeHtml(b.title || b.id)}</option>`
            ).join('');
            if (!shelf[currentBookId]) currentBookId = books[0]?.id || 'fanren';
            bookSelect.value = currentBookId;
            currentDataPath = shelf[currentBookId]?.dataPath || 'novel';
        }

        bookSelect.addEventListener('change', () => {
            currentBookId = bookSelect.value;
            currentDataPath = shelf[currentBookId]?.dataPath || `novel/books/${currentBookId}`;
            loadChapters();
        });

        // 新增書
        newBookBtn.addEventListener('click', () => {
            newBookForm.classList.toggle('show');
            newBookTitle.focus();
        });
        cancelBookBtn.addEventListener('click', () => {
            newBookForm.classList.remove('show');
            newBookTitle.value = '';
            newBookAuthor.value = '';
        });
        createBookBtn.addEventListener('click', async () => {
            const title = newBookTitle.value.trim();
            if (!title) { alert('請輸入書名'); return; }
            const id = 'book_' + Date.now();
            const maxOrder = Math.max(0, ...Object.values(shelf).map(b => b.order || 0));
            const entry = {
                title,
                author: newBookAuthor.value.trim() || '',
                dataPath: `novel/books/${id}`,
                order: maxOrder + 1,
                createdAt: Date.now()
            };
            await set(ref(db, `novel/shelf/${id}`), entry);
            shelf[id] = entry;
            currentBookId = id;
            currentDataPath = entry.dataPath;
            newBookForm.classList.remove('show');
            newBookTitle.value = '';
            newBookAuthor.value = '';
            populateBookSelect();
            await loadChapters();
            alert(`已建立「${title}」，現在可以上傳這本書的章節`);
        });
        
        // ============ 登入狀態 ============
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                loginArea.style.display = 'none';
                userBar.classList.add('show');
                mainContent.style.display = 'block';

                userPhoto.src = user.photoURL || '';
                userName.textContent = user.displayName || user.email;

                await ensureShelf();
                populateBookSelect();
                loadChapters();
            } else {
                loginArea.style.display = 'block';
                userBar.classList.remove('show');
                mainContent.style.display = 'none';
            }
        });
        
        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error('登入失敗:', error);
                alert('登入失敗，請重試');
            }
        });
        
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });
        
        // ============ 分頁切換 ============
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
                
                if (tab.dataset.tab === 'manage') {
                    loadChapters();
                }
            });
        });
        
        // ============ 載入章節 ============
        async function loadChapters() {
            try {
                // 優先讀輕量 toc（省流量）
                const tocSnap = await get(ref(db, `${currentDataPath}/toc`));
                if (tocSnap.exists()) {
                    const toc = tocSnap.val();
                    chaptersData = {};
                    Object.keys(toc).forEach(k => { chaptersData[k] = { title: toc[k] }; });
                    displayChapters();
                    return;
                }
                // 舊書沒有 toc：讀一次全章，順手建好
                const snapshot = await get(ref(db, chaptersPath()));
                if (snapshot.exists()) {
                    chaptersData = snapshot.val();
                    const toc = {};
                    Object.keys(chaptersData).forEach(k => { toc[k] = chaptersData[k].title; });
                    set(ref(db, `${currentDataPath}/toc`), toc).catch(() => {});
                    displayChapters();
                } else {
                    chaptersData = {};
                    chapterList.innerHTML = '<div class="empty-state">尚未上傳任何章節</div>';
                    chapterStats.textContent = '共 0 章';
                    deleteAllBtn.style.display = 'none';
                }
            } catch (error) {
                console.error('載入失敗:', error);
                chapterList.innerHTML = '<div class="empty-state">載入失敗</div>';
            }
        }
        
        function displayChapters() {
            const chapters = Object.keys(chaptersData)
                .map(key => ({
                    num: parseInt(key),
                    title: chaptersData[key].title
                }))
                .sort((a, b) => a.num - b.num);
            
            if (chapters.length === 0) {
                chapterList.innerHTML = '<div class="empty-state">尚未上傳任何章節</div>';
                chapterStats.textContent = '共 0 章';
                deleteAllBtn.style.display = 'none';
                return;
            }
            
            const first = chapters[0].num;
            const last = chapters[chapters.length - 1].num;
            chapterStats.textContent = `共 ${chapters.length} 章 (第${first}章 ~ 第${last}章)`;
            deleteAllBtn.style.display = 'inline-flex';
            
            chapterList.innerHTML = chapters.map(ch => `
                <div class="chapter-item">
                    <span class="chapter-num">#${ch.num}</span>
                    <span class="chapter-title">${escapeHtml(ch.title)}</span>
                    <button class="delete-btn" data-num="${ch.num}" data-title="${escapeHtml(ch.title)}">刪除</button>
                </div>
            `).join('');
            
            // 綁定刪除按鈕
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    deleteTarget = btn.dataset.num;
                    deleteMessage.textContent = `確定要刪除「${btn.dataset.title}」嗎？`;
                    deleteModal.classList.add('show');
                });
            });
        }
        
        // ============ 刪除章節 ============
        cancelDelete.addEventListener('click', () => {
            deleteModal.classList.remove('show');
            deleteTarget = null;
            deleteAll = false;
        });
        
        confirmDelete.addEventListener('click', async () => {
            try {
                if (deleteAll) {
                    // 刪除全部（含這本書的目錄/進度/書籤）
                    await remove(ref(db, chaptersPath()));
                    await remove(ref(db, `${currentDataPath}/toc`));
                    await remove(ref(db, `novel/state/${currentBookId}`));
                    deleteAll = false;
                } else if (deleteTarget) {
                    // 刪除單一章節 + 目錄項
                    await remove(ref(db, `${chaptersPath()}/${deleteTarget}`));
                    await remove(ref(db, `${currentDataPath}/toc/${deleteTarget}`));
                }
                
                deleteModal.classList.remove('show');
                deleteTarget = null;
                await loadChapters();
                await updateNovelInfo();
            } catch (error) {
                console.error('刪除失敗:', error);
                alert('刪除失敗');
            }
        });
        
        // 全部刪除按鈕
        deleteAllBtn.addEventListener('click', () => {
            const count = Object.keys(chaptersData).length;
            deleteAll = true;
            deleteTarget = null;
            deleteMessage.textContent = `確定要刪除全部 ${count} 章嗎？此操作無法復原！`;
            deleteModal.classList.add('show');
        });
        
        // ============ 上傳功能 ============
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        async function handleFiles(filesList) {
            const files = Array.from(filesList).filter(f => f.name.endsWith('.txt'));
            
            if (files.length === 0) {
                alert('請選擇 TXT 檔案');
                return;
            }
            
            progressSection.style.display = 'block';
            
            let uploaded = 0;
            let failed = 0;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                try {
                    statusText.textContent = `正在處理: ${file.name}`;
                    
                    const content = await readFile(file);
                    const { chapterNum, title, text } = parseChapter(content, file.name);
                    
                    if (!chapterNum) {
                        console.warn('無法提取章節號:', file.name);
                        failed++;
                        continue;
                    }
                    
                    // 上傳到 Firebase（目前選定的書）
                    await set(ref(db, `${chaptersPath()}/${chapterNum}`), {
                        title: title,
                        content: text,
                        uploadedAt: Date.now()
                    });
                    // 同步輕量目錄 toc（閱讀器列目錄只讀這個，省流量）
                    await set(ref(db, `${currentDataPath}/toc/${chapterNum}`), title);
                    
                    uploaded++;
                    
                } catch (error) {
                    console.error('上傳失敗:', file.name, error);
                    failed++;
                }
                
                const progress = Math.round(((i + 1) / files.length) * 100);
                progressFill.style.width = progress + '%';
                progressFill.textContent = progress + '%';
            }
            
            // 更新小說資訊
            await updateNovelInfo();
            
            statusText.textContent = `完成！成功 ${uploaded} 章` + (failed > 0 ? `，失敗 ${failed} 章` : '');
            
            // 重新載入章節列表
            await loadChapters();
            
            // 3秒後重置上傳區
            setTimeout(() => {
                progressSection.style.display = 'none';
                progressFill.style.width = '0%';
                progressFill.textContent = '0%';
                fileInput.value = '';
            }, 3000);
        }
        
        async function updateNovelInfo() {
            const snapshot = await get(ref(db, chaptersPath()));
            const total = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
            const title = shelf[currentBookId]?.title || '未命名';

            await set(ref(db, infoPath()), {
                title,
                totalChapters: total,
                updatedAt: Date.now()
            });
            // 同步更新書架的總章數
            await update(ref(db, `novel/shelf/${currentBookId}`), { totalChapters: total });
            shelf[currentBookId].totalChapters = total;
        }
        
        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsText(file, 'UTF-8');
            });
        }
        
        function filePrefixNum(filename) {
            // 檔名數字前綴當章節號:02_xxx.txt→2、16-結論.txt→16、2600 標題.txt→2600、2601.txt→2601
            // 分隔符接受 底線/減號/空白/點(副檔名),都沒有也吃(純數字檔名)
            const m = filename.match(/^(\d+)(?:[ _.\-]|$)/);
            return m ? parseInt(m[1]) : null;
        }

        function parseChapter(content, filename) {
            const lines = content.split('\n');
            let title = lines[0]?.trim() || '';

            // 章節號:優先用檔名數字前綴,否則從標題/檔名的「第X章」抽
            const chapterNum = filePrefixNum(filename) || extractChapterNumber(title) || extractChapterNumber(filename);

            // 找正文起點:有 '=' 分隔線就跳到其後;否則跳過標題那一行
            let contentStart = 1;
            for (let i = 0; i < Math.min(5, lines.length); i++) {
                if (lines[i].startsWith('=')) {
                    contentStart = i + 1;
                    break;
                }
            }

            const text = lines.slice(contentStart).join('\n').trim();
            
            return { chapterNum, title, text };
        }
        
        function extractChapterNumber(text) {
            // 中文數字對照
            const cnNums = {
                '零': 0, '一': 1, '二': 2, '三': 3, '四': 4,
                '五': 5, '六': 6, '七': 7, '八': 8, '九': 9,
                '十': 10, '百': 100, '千': 1000, '兩': 2
            };
            
            // 嘗試匹配「第XXX章」
            const match = text.match(/第([零一二三四五六七八九十百千兩\d]+)章/);
            if (!match) return null;
            
            const numStr = match[1];
            
            // 如果是阿拉伯數字
            if (/^\d+$/.test(numStr)) {
                return parseInt(numStr);
            }
            
            // 轉換中文數字
            return chineseToNumber(numStr, cnNums);
        }
        
        function chineseToNumber(str, cnNums) {
            let result = 0;
            let temp = 0;
            let prevUnit = 1;
            
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                const num = cnNums[char];
                
                if (num === undefined) continue;
                
                if (num >= 10) {
                    // 是單位（十、百、千）
                    if (temp === 0) temp = 1;
                    temp *= num;
                    result += temp;
                    temp = 0;
                } else {
                    // 是數字
                    temp = num;
                }
            }
            
            result += temp;
            return result || null;
        }
    </script>
