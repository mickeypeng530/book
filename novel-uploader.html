<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小說上傳工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
        }
        
        /* 登入區 */
        .login-area {
            text-align: center;
            padding: 60px 40px;
        }
        
        .login-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 15px 30px;
            background: #fff;
            color: #333;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .login-btn img {
            width: 24px;
            height: 24px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        
        .logout-btn {
            padding: 8px 16px;
            background: transparent;
            color: #aaa;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .upload-area {
            background: rgba(255,255,255,0.1);
            border: 3px dashed rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
        }
        
        .upload-area.show {
            display: block;
        }
        
        .upload-area:hover {
            border-color: #4a90d9;
            background: rgba(74, 144, 217, 0.1);
        }
        
        .upload-area.dragover {
            border-color: #4a90d9;
            background: rgba(74, 144, 217, 0.2);
        }
        
        .upload-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .upload-area h2 {
            margin-bottom: 10px;
        }
        
        .upload-area p {
            color: #aaa;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #3a7bc8;
            transform: translateY(-2px);
        }
        
        .progress-section {
            margin-top: 40px;
            display: none;
        }
        
        .progress-bar {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 30px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a90d9, #63b3ed);
            border-radius: 10px;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .status {
            text-align: center;
            color: #aaa;
        }
        
        .file-list {
            margin-top: 30px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .file-item {
            background: rgba(255,255,255,0.05);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-item.success {
            border-left: 4px solid #4ade80;
        }
        
        .file-item.error {
            border-left: 4px solid #f87171;
        }
        
        .file-item.pending {
            border-left: 4px solid #fbbf24;
        }
        
        .success-message {
            text-align: center;
            margin-top: 40px;
            padding: 30px;
            background: rgba(74, 222, 128, 0.1);
            border-radius: 15px;
            display: none;
        }
        
        .success-message h2 {
            color: #4ade80;
            margin-bottom: 15px;
        }
        
        .reader-link {
            color: #4a90d9;
            text-decoration: none;
            font-size: 1.2rem;
        }
        
        .reader-link:hover {
            text-decoration: underline;
        }
        
        /* 已上傳章節區 */
        .uploaded-section {
            margin-top: 30px;
            padding: 25px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .uploaded-section h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .uploaded-summary {
            color: #aaa;
            line-height: 1.8;
        }
        
        .uploaded-summary .chapter-range {
            color: #4ade80;
            font-weight: bold;
        }
        
        .uploaded-summary .chapter-item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .uploaded-summary .ellipsis {
            color: #666;
            text-align: center;
            padding: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 小說上傳工具</h1>
        <p class="subtitle">將 TXT 檔案上傳到 Firebase，即可跨裝置閱讀</p>
        
        <!-- 登入區 -->
        <div class="login-area" id="loginArea">
            <p style="margin-bottom: 30px; color: #aaa;">請先登入以上傳小說</p>
            <button class="login-btn" id="loginBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                使用 Google 登入
            </button>
        </div>
        
        <!-- 用戶資訊 -->
        <div class="user-info" id="userInfo" style="display: none;">
            <img id="userPhoto" src="" alt="頭像">
            <span id="userName"></span>
            <a href="index.html" class="btn" style="background: #4ade80; text-decoration: none;">📖 前往閱讀</a>
            <button class="logout-btn" id="logoutBtn">登出</button>
        </div>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <h2>選擇或拖曳 TXT 檔案</h2>
            <p>支援多選，會自動按檔名排序</p>
            <label class="btn">
                選擇檔案
                <input type="file" id="fileInput" accept=".txt" multiple>
            </label>
        </div>
        
        <!-- 已上傳章節 -->
        <div class="uploaded-section" id="uploadedSection" style="display: none;">
            <h3>📚 已上傳章節</h3>
            <div class="uploaded-summary" id="uploadedSummary"></div>
        </div>
        
        <div class="progress-section" id="progressSection">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
            </div>
            <p class="status" id="statusText">準備上傳...</p>
            
            <div class="file-list" id="fileList"></div>
        </div>
        
        <div class="success-message" id="successMessage">
            <h2>✅ 上傳完成！</h2>
            <p>共上傳 <span id="totalChapters">0</span> 章</p>
            <p style="margin-top: 20px;">
                <a href="index.html" class="reader-link">👉 前往閱讀器開始閱讀</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithPopup, signOut, onAuthStateChanged, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        // Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyATCaOlYxkYTle1hPzYAcuXNlQHaAuO3-8",
            authDomain: "case-scheduler-f752b.firebaseapp.com",
            databaseURL: "https://case-scheduler-f752b-default-rtdb.firebaseio.com",
            projectId: "case-scheduler-f752b",
            storageBucket: "case-scheduler-f752b.firebasestorage.app",
            messagingSenderId: "703006186929",
            appId: "1:703006186929:web:57ac5b059678005455f190"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        
        // DOM 元素
        const loginArea = document.getElementById('loginArea');
        const loginBtn = document.getElementById('loginBtn');
        const userInfo = document.getElementById('userInfo');
        const userPhoto = document.getElementById('userPhoto');
        const userName = document.getElementById('userName');
        const logoutBtn = document.getElementById('logoutBtn');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progressSection = document.getElementById('progressSection');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const fileList = document.getElementById('fileList');
        const successMessage = document.getElementById('successMessage');
        const totalChapters = document.getElementById('totalChapters');
        const uploadedSection = document.getElementById('uploadedSection');
        const uploadedSummary = document.getElementById('uploadedSummary');
        
        // 載入已上傳章節
        async function loadUploadedChapters() {
            try {
                const snapshot = await get(ref(db, 'novel/chapters'));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const chapters = Object.keys(data)
                        .map(key => ({
                            num: parseInt(key),
                            title: data[key].title
                        }))
                        .sort((a, b) => a.num - b.num);
                    
                    if (chapters.length > 0) {
                        displayUploadedChapters(chapters);
                    }
                }
            } catch (error) {
                console.error('載入章節失敗:', error);
            }
        }
        
        function displayUploadedChapters(chapters) {
            uploadedSection.style.display = 'block';
            
            const total = chapters.length;
            const first = chapters[0];
            const last = chapters[chapters.length - 1];
            
            let html = `<p>共 <span class="chapter-range">${total}</span> 章</p>`;
            
            if (total <= 6) {
                // 少於6章，全部顯示
                html += chapters.map(ch => 
                    `<div class="chapter-item">${ch.num}. ${ch.title}</div>`
                ).join('');
            } else {
                // 顯示前3章
                html += chapters.slice(0, 3).map(ch => 
                    `<div class="chapter-item">${ch.num}. ${ch.title}</div>`
                ).join('');
                
                // 省略號
                html += `<div class="ellipsis">⋮ (${total - 6} 章省略)</div>`;
                
                // 顯示後3章
                html += chapters.slice(-3).map(ch => 
                    `<div class="chapter-item">${ch.num}. ${ch.title}</div>`
                ).join('');
            }
            
            uploadedSummary.innerHTML = html;
        }
        
        // 監聽登入狀態
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // 已登入
                loginArea.style.display = 'none';
                userInfo.style.display = 'flex';
                uploadArea.classList.add('show');
                
                userPhoto.src = user.photoURL || '';
                userName.textContent = user.displayName || user.email;
                
                // 載入已上傳章節
                loadUploadedChapters();
            } else {
                // 未登入
                loginArea.style.display = 'block';
                userInfo.style.display = 'none';
                uploadArea.classList.remove('show');
                uploadedSection.style.display = 'none';
            }
        });
        
        // 登入
        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error('登入失敗:', error);
                alert('登入失敗，請重試');
            }
        });
        
        // 登出
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });
        
        // 拖曳上傳
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        async function handleFiles(filesList) {
            const files = Array.from(filesList).filter(f => f.name.endsWith('.txt'));
            
            if (files.length === 0) {
                alert('請選擇 TXT 檔案');
                return;
            }
            
            // 按檔名排序
            files.sort((a, b) => a.name.localeCompare(b.name, 'zh-TW', { numeric: true }));
            
            // 顯示進度區
            progressSection.style.display = 'block';
            uploadArea.style.display = 'none';
            
            // 初始化檔案列表
            fileList.innerHTML = files.map((f, i) => `
                <div class="file-item pending" id="file-${i}">
                    <span>${f.name}</span>
                    <span>等待中...</span>
                </div>
            `).join('');
            
            let uploaded = 0;
            const chapters = [];
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileItem = document.getElementById(`file-${i}`);
                
                try {
                    statusText.textContent = `正在處理: ${file.name}`;
                    
                    const content = await readFile(file);
                    const { title, text } = parseChapter(content, file.name);
                    
                    // 上傳到 Firebase
                    const chapterNum = i + 1;
                    await set(ref(db, `novel/chapters/${chapterNum}`), {
                        title: title,
                        content: text,
                        uploadedAt: Date.now()
                    });
                    
                    chapters.push({ num: chapterNum, title });
                    
                    uploaded++;
                    const progress = Math.round((uploaded / files.length) * 100);
                    progressFill.style.width = progress + '%';
                    progressFill.textContent = progress + '%';
                    
                    fileItem.classList.remove('pending');
                    fileItem.classList.add('success');
                    fileItem.querySelector('span:last-child').textContent = '✓ 完成';
                    
                } catch (error) {
                    console.error('上傳失敗:', file.name, error);
                    fileItem.classList.remove('pending');
                    fileItem.classList.add('error');
                    fileItem.querySelector('span:last-child').textContent = '✗ 失敗';
                }
            }
            
            // 儲存章節目錄
            await set(ref(db, 'novel/info'), {
                title: '凡人修仙傳',
                totalChapters: chapters.length,
                updatedAt: Date.now()
            });
            
            // 顯示完成訊息
            statusText.textContent = '上傳完成！';
            totalChapters.textContent = uploaded;
            successMessage.style.display = 'block';
        }
        
        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsText(file, 'UTF-8');
            });
        }
        
        function parseChapter(content, filename) {
            const lines = content.split('\n');
            
            // 取得標題
            let title = lines[0]?.trim() || filename.replace('.txt', '');
            
            // 如果標題是分隔線，用檔名
            if (title.startsWith('=')) {
                title = filename.replace('.txt', '').replace(/^\d+_/, '');
            }
            
            // 找正文（跳過標題和分隔線）
            let contentStart = 0;
            for (let i = 0; i < Math.min(5, lines.length); i++) {
                if (lines[i].startsWith('=')) {
                    contentStart = i + 1;
                    break;
                }
            }
            
            const text = lines.slice(contentStart).join('\n').trim();
            
            return { title, text };
        }
    </script>
</body>
</html>
